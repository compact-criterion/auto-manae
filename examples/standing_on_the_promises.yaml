lyrics:
  stanza1:
    S1: "Stand-ing on the prom-is-es of Christ my King,"
    S2: "Through e-ter-nal a-ges let His prais-es ring;"
    S3: "Glo-ry in the high-est, I will shout and sing,"
    S4: "Stand-ing on the prom-is-es of God."
  stanza2:
    S1: "Stand-ing on the prom-is-es that can-not fail,"
    S2: "When the howl-ing storms of doubt and fear as-sail,"
    S3: "By the liv-ing Word of God I shall pre-vail,"
    S4: "Stand-ing on the prom-is-es of God."
  stanza3:
    S1: "Stand-ing on the prom-is-es I now can see"
    S2: "Per-fect, pres-ent cleans-ing in the blood for me;"
    S3: "Stand-ing in the lib-er-ty where Christ makes free,"
    S4: "Stand-ing on the prom-is-es of God."
  refrain:
    R1: "Stand-ing, stand-ing,"
    R1.alto: "Stand-ing on the prom-is-es, stand-ing on the prom-is-es,"
    R2: "Stand-ing on the prom-is-es of God my Sav-ior;"
    R3: "Stand-ing, stand-ing,"
    R3.alto: "Stand-ing on the prom-is-es, stand-ing on the prom-is-es,"
    R4: "I'm stand-ing on the prom-is-es of God."

structure:
  - { label: "Stanza 1", phrases: [S1, S2, S3, S4], lyrics: stanza1 }
  - { label: "Refrain",  phrases: [R1, R2, R3, R4], lyrics: refrain }
  - { label: "Stanza 2", phrases: [S1, S2, S3, S4], lyrics: stanza2 }
  - { label: "Stanza 3", phrases: [S1, S2, S3, S4], lyrics: stanza3 }
