<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Graph Quest</title>
<style>
:root{
  --bg:#0f172a; --panel:#1e293b; --panel2:#334155; --text:#f1f5f9; --muted:#94a3b8;
  --accent:#38bdf8; --good:#4ade80; --bad:#f87171; --warn:#fbbf24;
  --c0:#f87171; --c1:#38bdf8; --c2:#4ade80; --c3:#fbbf24;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;touch-action:manipulation}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;border:0;border-radius:14px;background:var(--panel2);min-height:48px;padding:0 16px;cursor:pointer}
button:active{transform:scale(.96)}
button.primary{background:var(--accent);color:#082f49;font-weight:700}
button[disabled]{opacity:.4}
.screen{display:none;height:100%;flex-direction:column;padding:12px 16px}
.screen.on{display:flex}
h1{margin:8px 0 2px;font-size:32px}
.sub{color:var(--muted);margin:0 0 12px;font-size:18px}
#menu{overflow-y:auto}
.card{background:var(--panel);border-radius:18px;padding:14px;margin-bottom:12px}
.card h2{margin:0;font-size:22px}
.card p{margin:4px 0 10px;color:var(--muted);font-size:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{width:56px;min-height:56px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:700;font-size:20px;line-height:1.1}
.chip small{font-size:12px;color:var(--warn);letter-spacing:1px;min-height:14px}
.top{display:flex;align-items:center;gap:10px}
.top .ttl{flex:1;min-width:0}
.top .ttl b{display:block;font-size:20px}
.top .ttl span{color:var(--muted);font-size:15px}
#goal{margin:8px 0 4px;font-size:18px;min-height:46px}
#msg{min-height:26px;font-size:17px;color:var(--warn)}
#board{flex:1;min-height:0;display:flex;background:var(--panel);border-radius:18px;margin:4px 0 8px}
#board.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
svg{width:100%;height:100%;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.node{cursor:pointer}
.node text{font-size:6.2px;font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none;fill:#0f172a}
.wlabel text{font-size:6px;font-weight:700;text-anchor:middle;dominant-baseline:central;fill:var(--text);pointer-events:none}
.bar{display:flex;gap:8px;margin-bottom:8px}
.bar button{flex:1;white-space:nowrap;padding:0 8px}
#status{display:flex;justify-content:space-between;font-size:18px;margin-bottom:8px}
#win{position:fixed;inset:0;background:rgba(2,6,23,.8);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
#win.on{display:flex}
#win .box{background:var(--panel);border-radius:22px;padding:20px;max-width:420px;width:100%;text-align:center}
#win .stars{font-size:44px;color:var(--warn);letter-spacing:6px}
#win h2{margin:4px 0}
#win p{font-size:18px;color:var(--muted);margin:8px 0 14px}
#win .bar button{min-height:52px}
</style>
</head>
<body>

<div id="menu" class="screen on">
  <h1>🕸️ Graph Quest</h1>
  <p class="sub">Four puzzles from graph theory. Tap a level to play. Best played on your phone.</p>
  <div id="modes"></div>
  <div class="bar"><button id="shareBtn">📲 Share with a friend</button><button id="resetAll">Reset progress</button></div>
</div>

<div id="game" class="screen">
  <div class="top">
    <button id="back" aria-label="Back to menu">←</button>
    <div class="ttl"><b id="gtitle"></b><span id="glevel"></span></div>
    <button id="hint">💡</button>
  </div>
  <div id="goal"></div>
  <div id="board"><svg id="svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg></div>
  <div id="msg"></div>
  <div id="status"><span id="s1"></span><span id="s2"></span></div>
  <div class="bar">
    <button id="undo">↶ Undo</button>
    <button id="reset">⟲ Reset</button>
    <button id="extra" style="display:none"></button>
  </div>
</div>

<div id="win"><div class="box">
  <div class="stars" id="wstars"></div>
  <h2 id="wtitle">Solved!</h2>
  <p id="wtext"></p>
  <div class="bar"><button id="wmenu">Menu</button><button id="wagain">Replay</button><button id="wnext" class="primary">Next ▶</button></div>
</div></div>

<script>
'use strict';
// ---------- helpers ----------
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
};
const circle = (n, cx, cy, r, a0 = -90) => Array.from({length: n}, (_, i) => {
  const a = (a0 + 360 * i / n) * Math.PI / 180;
  return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
});
const grid = (rows, cols, x0, x1, y0, y1) => {
  const p = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
    p.push([x0 + (x1 - x0) * (cols > 1 ? c / (cols - 1) : 0), y0 + (y1 - y0) * (rows > 1 ? r / (rows - 1) : 0)]);
  return p;
};
const gridEdges = (rows, cols) => {
  const e = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const i = r * cols + c;
    if (c + 1 < cols) e.push([i, i + 1]);
    if (r + 1 < rows) e.push([i, i + cols]);
  }
  return e;
};
const LET = i => String.fromCharCode(65 + i);
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
const save = {
  get() { try { return JSON.parse(localStorage.getItem('graphquest') || '{}'); } catch (e) { return {}; } },
  set(o) { try { localStorage.setItem('graphquest', JSON.stringify(o)); } catch (e) {} }
};

// ---------- graph algorithms ----------
function oddVertices(n, edges) {
  const d = Array(n).fill(0);
  edges.forEach(([a, b]) => { d[a]++; d[b]++; });
  return d.map((x, i) => x % 2 ? i : -1).filter(i => i >= 0);
}
function adjacency(n, edges) {
  const adj = Array.from({length: n}, () => []);
  edges.forEach(([a, b, w], i) => { adj[a].push([b, w, i]); adj[b].push([a, w, i]); });
  return adj;
}
function dijkstra(n, edges, s, t) {
  const adj = adjacency(n, edges), dist = Array(n).fill(Infinity), prev = Array(n).fill(-1), done = Array(n).fill(false);
  dist[s] = 0;
  for (let k = 0; k < n; k++) {
    let u = -1;
    for (let i = 0; i < n; i++) if (!done[i] && (u < 0 || dist[i] < dist[u])) u = i;
    if (u < 0 || dist[u] === Infinity) break;
    done[u] = true;
    adj[u].forEach(([v, w]) => { if (dist[u] + w < dist[v]) { dist[v] = dist[u] + w; prev[v] = u; } });
  }
  const path = [];
  for (let v = t; v >= 0; v = prev[v]) path.unshift(v);
  return {cost: dist[t], path};
}
function find(p, x) { while (p[x] !== x) { p[x] = p[p[x]]; x = p[x]; } return x; }
function kruskal(n, edges) {
  const p = Array.from({length: n}, (_, i) => i), order = edges.map((e, i) => i).sort((a, b) => edges[a][2] - edges[b][2]);
  const picked = []; let cost = 0;
  for (const i of order) {
    const a = find(p, edges[i][0]), b = find(p, edges[i][1]);
    if (a !== b) { p[a] = b; picked.push(i); cost += edges[i][2]; }
  }
  return {cost, picked};
}
function chromatic(n, edges) {
  const adj = adjacency(n, edges);
  const order = [...Array(n).keys()].sort((a, b) => adj[b].length - adj[a].length);
  for (let k = 1; k <= n; k++) {
    const col = Array(n).fill(-1);
    const go = i => {
      if (i === n) return true;
      const v = order[i];
      for (let c = 0; c < k; c++) {
        if (adj[v].every(([u]) => col[u] !== c)) { col[v] = c; if (go(i + 1)) return true; col[v] = -1; }
      }
      return false;
    };
    if (go(0)) return k;
  }
}

// ---------- levels ----------
const house = {pts: [[50,14],[16,42],[84,42],[16,86],[84,86]], edges: [[0,1],[0,2],[1,2],[1,3],[2,4],[3,4]]};
const ladder = {pts: grid(2, 3, 18, 82, 32, 68), edges: gridEdges(2, 3)};
const envelope = {pts: [[50,14],[16,42],[84,42],[16,86],[84,86]], edges: [[0,1],[0,2],[1,2],[1,3],[2,4],[3,4],[1,4],[2,3]]};
const bowtie = {pts: [[50,50],[16,18],[16,82],[84,18],[84,82]], edges: [[0,1],[0,2],[1,2],[0,3],[0,4],[3,4]]};
const g33 = {pts: grid(3, 3, 18, 82, 18, 82), edges: gridEdges(3, 3)};
const k5 = {pts: circle(5, 50, 52, 38), edges: (() => { const e = []; for (let i = 0; i < 5; i++) for (let j = i + 1; j < 5; j++) e.push([i, j]); return e; })()};
const cube = (() => {
  const o = circle(4, 50, 50, 42, -135), i = circle(4, 50, 50, 20, -135);
  const e = []; for (let k = 0; k < 4; k++) { e.push([k, (k + 1) % 4], [4 + k, 4 + (k + 1) % 4], [k, 4 + k]); }
  return {pts: o.concat(i), edges: e};
})();
const petersen = (() => {
  const o = circle(5, 50, 50, 40), i = circle(5, 50, 50, 20), e = [];
  for (let k = 0; k < 5; k++) e.push([k, (k + 1) % 5], [5 + k, 5 + (k + 2) % 5], [k, 5 + k]);
  return {pts: o.concat(i), edges: e};
})();
const grotzsch = (() => {
  const u = circle(5, 50, 50, 42), v = circle(5, 50, 50, 24), e = [];
  for (let k = 0; k < 5; k++) {
    e.push([k, (k + 1) % 5]);
    e.push([5 + k, (k + 1) % 5], [5 + k, (k + 4) % 5]);
    e.push([10, 5 + k]);
  }
  return {pts: u.concat(v, [[50, 50]]), edges: e};
})();
const wheel = (() => {
  const r = circle(5, 50, 50, 38), e = [];
  for (let k = 0; k < 5; k++) e.push([k, (k + 1) % 5], [5, k]);
  return {pts: r.concat([[50, 50]]), edges: e};
})();
const c5 = {pts: circle(5, 50, 52, 38), edges: [[0,1],[1,2],[2,3],[3,4],[4,0]]};
const bip = {pts: grid(3, 3, 18, 82, 18, 82), edges: gridEdges(3, 3)};

const pathA = {pts: [[10,50],[35,20],[35,80],[65,20],[65,80],[90,50]],
  edges: [[0,1,2],[0,2,5],[1,3,7],[1,2,1],[2,4,3],[3,5,2],[4,5,6],[3,4,1]], s: 0, t: 5};
const pathB = {pts: [[7,50],[36,12],[36,50],[36,88],[66,12],[66,50],[66,88],[93,50]],
  edges: [[0,1,4],[0,2,2],[0,3,6],[1,2,1],[2,3,2],[1,4,3],[2,5,7],[3,6,3],[4,5,2],[5,6,1],[4,7,6],[5,7,3],[6,7,4]], s: 0, t: 7};
const pathC = {pts: grid(3, 3, 14, 86, 14, 86),
  edges: [[0,1,3],[1,2,8],[3,4,2],[4,5,5],[6,7,1],[7,8,2],[0,3,6],[1,4,1],[2,5,2],[3,6,4],[4,7,7],[5,8,3]], s: 0, t: 8};
const mstA = {pts: circle(5, 50, 52, 38),
  edges: [[0,1,4],[1,2,6],[2,3,3],[3,4,5],[4,0,7],[0,2,2],[1,3,8],[0,3,9],[1,4,1]]};
const mstB = {pts: pathB.pts, edges: pathB.edges};
const mstC = {pts: pathC.pts, edges: pathC.edges};

const MODES = {
  euler: {
    icon: '🚶', title: 'Bridge Walker',
    desc: 'Trace every road exactly once without lifting your finger. Or decide it cannot be done.',
    levels: [
      {name: 'The House', g: house},
      {name: 'Ladder', g: ladder},
      {name: 'Envelope', g: envelope},
      {name: 'Bow Tie', g: bowtie},
      {name: 'Grid', g: g33},
      {name: 'Pentagram', g: k5},
      {name: 'Cube', g: cube},
    ],
    concept: 'Euler (1736): a connected graph has a walk using every edge exactly once if and only if it has 0 or 2 vertices of odd degree. With 2, the walk must start at one and end at the other.',
  },
  color: {
    icon: '🎨', title: 'Map Painter',
    desc: 'Tap a node to cycle its color. Joined nodes must never match. Use as few colors as possible.',
    levels: [
      {name: 'Pentagon', g: c5},
      {name: 'Checkerboard', g: bip},
      {name: 'Wheel', g: wheel},
      {name: 'Petersen', g: petersen},
      {name: 'Grötzsch', g: grotzsch},
    ],
    concept: 'The smallest number of colors needed is the chromatic number χ(G). Odd cycles need 3, bipartite graphs need only 2, and a wheel with an odd rim needs 4.',
  },
  path: {
    icon: '🏃', title: 'Shortest Route',
    desc: 'Tap nodes to travel from the green start to the red goal. Find the cheapest total.',
    levels: [
      {name: 'Two Lanes', g: pathA},
      {name: 'Crossroads', g: pathB},
      {name: 'City Grid', g: pathC},
    ],
    concept: 'Dijkstra’s algorithm always settles the nearest unvisited node next. The route with the fewest roads is often not the cheapest one.',
  },
  mst: {
    icon: '🌳', title: 'Cable Layout',
    desc: 'Tap edges to lay cable so every node is connected at the lowest total cost. No loops.',
    levels: [
      {name: 'Five Towns', g: mstA},
      {name: 'Eight Towns', g: mstB},
      {name: 'Big Grid', g: mstC},
    ],
    concept: 'A spanning tree joins all n nodes with exactly n − 1 edges. Kruskal’s greedy rule works: take the cheapest edge that does not close a loop.',
  },
};
const MODE_KEYS = Object.keys(MODES);

// ---------- menu ----------
function buildMenu() {
  const prog = save.get(), host = $('#modes');
  host.innerHTML = '';
  MODE_KEYS.forEach(m => {
    const M = MODES[m], card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<h2>${M.icon} ${M.title}</h2><p>${M.desc}</p>`;
    const chips = document.createElement('div'); chips.className = 'chips';
    M.levels.forEach((L, i) => {
      const s = prog[m + i] || 0, b = document.createElement('button');
      b.className = 'chip';
      b.innerHTML = `${i + 1}<small>${s ? '★'.repeat(s) : ''}</small>`;
      b.setAttribute('aria-label', `${M.title} level ${i + 1}`);
      b.onclick = () => start(m, i);
      chips.appendChild(b);
    });
    card.appendChild(chips);
    host.appendChild(card);
  });
}
function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }

// ---------- game ----------
let G = null;
const svg = $('#svg');
const COLORS = ['var(--c0)', 'var(--c1)', 'var(--c2)', 'var(--c3)'];

function say(t, bad) {
  $('#msg').textContent = t || '';
  if (bad) { const b = $('#board'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); buzz(60); }
}

function start(mode, idx) {
  const M = MODES[mode], L = M.levels[idx], g = L.g, n = g.pts.length;
  G = {mode, idx, L, g, n, edges: g.edges, mistakes: 0, moves: 0, done: false, hist: [], showDeg: false};
  if (mode === 'euler') {
    G.path = []; G.used = new Set(); G.odd = oddVertices(n, g.edges);
    G.possible = G.odd.length <= 2;
  } else if (mode === 'color') {
    G.col = Array(n).fill(-1); G.k = chromatic(n, g.edges);
  } else if (mode === 'path') {
    G.best = dijkstra(n, g.edges, g.s, g.t); G.path = [g.s];
  } else {
    G.best = kruskal(n, g.edges); G.sel = new Set();
  }
  $('#gtitle').textContent = `${M.icon} ${M.title}`;
  $('#glevel').textContent = `Level ${idx + 1}: ${L.name}`;
  const goals = {
    euler: 'Tap a start node, then tap neighbors to trace each road once. Tap “Impossible!” if no such walk exists.',
    color: `Color every node with at most ${G.k} colors so no two joined nodes match.`,
    path: `Travel from the start to the goal. Edge numbers are costs.`,
    mst: `Connect all ${n} nodes using exactly ${n - 1} edges for the lowest total cost.`
  };
  $('#goal').textContent = goals[mode];
  const ex = $('#extra');
  ex.style.display = mode === 'euler' ? '' : 'none';
  ex.textContent = 'Impossible!';
  $('#hint').textContent = mode === 'euler' ? '🔢' : '💡';
  $('#hint').setAttribute('aria-label', mode === 'euler' ? 'Show degrees' : 'Hint');
  say('');
  buildBoard();
  render();
  $('#win').classList.remove('on');
  show('game');
}

function buildBoard() {
  svg.innerHTML = '';
  const {g, mode} = G;
  G.edgeEls = []; G.nodeEls = [];
  const eg = el('g', {}, svg), ng = el('g', {}, svg);
  g.edges.forEach(([a, b, w], i) => {
    const [x1, y1] = g.pts[a], [x2, y2] = g.pts[b];
    const grp = el('g', {}, eg);
    const line = el('line', {x1, y1, x2, y2, 'stroke-linecap': 'round'}, grp);
    let lbl = null;
    if (w !== undefined) {
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      lbl = el('g', {class: 'wlabel'}, grp);
      el('rect', {x: mx - 4.6, y: my - 3.8, width: 9.2, height: 7.6, rx: 2, fill: '#0f172a', stroke: '#475569', 'stroke-width': .5}, lbl);
      const t = el('text', {x: mx, y: my}, lbl); t.textContent = w;
    }
    if (mode === 'mst') {
      const hit = el('line', {x1, y1, x2, y2, stroke: 'transparent', 'stroke-width': 11, 'stroke-linecap': 'round'}, grp);
      grp.style.cursor = 'pointer';
      grp.addEventListener('click', () => tapEdge(i));
    }
    G.edgeEls.push({line, lbl});
  });
  g.pts.forEach(([x, y], i) => {
    const grp = el('g', {class: 'node'}, ng);
    const halo = el('circle', {cx: x, cy: y, r: 9.5, fill: 'none', 'stroke-width': 1.4}, grp);
    const c = el('circle', {cx: x, cy: y, r: 7, stroke: '#0f172a', 'stroke-width': 1}, grp);
    const hit = el('circle', {cx: x, cy: y, r: 11, fill: 'transparent'}, grp);
    const t = el('text', {x, y}, grp);
    if (mode !== 'mst') grp.addEventListener('click', () => tapNode(i));
    G.nodeEls.push({halo, c, t});
  });
}

// ----- render -----
function render() {
  const {mode, g, n} = G;
  const deg = Array(n).fill(0);
  g.edges.forEach(([a, b]) => { deg[a]++; deg[b]++; });
  g.edges.forEach((_, i) => { G.edgeEls[i].line.setAttribute('stroke', '#64748b'); G.edgeEls[i].line.setAttribute('stroke-width', 1.4); });
  G.nodeEls.forEach((N, i) => {
    N.halo.setAttribute('stroke', 'none');
    N.c.setAttribute('fill', '#cbd5e1');
    N.t.textContent = LET(i);
  });
  const E = (i, color, w) => { G.edgeEls[i].line.setAttribute('stroke', color); G.edgeEls[i].line.setAttribute('stroke-width', w); };
  const eIdx = (a, b) => g.edges.findIndex(([x, y]) => (x === a && y === b) || (x === b && y === a));

  if (mode === 'euler') {
    G.used.forEach(i => E(i, 'var(--accent)', 2.8));
    const cur = G.path[G.path.length - 1];
    if (G.path.length) { G.nodeEls[G.path[0]].halo.setAttribute('stroke', 'var(--good)'); G.nodeEls[cur].halo.setAttribute('stroke', 'var(--accent)'); G.nodeEls[cur].c.setAttribute('fill', 'var(--accent)'); }
    if (G.showDeg) G.nodeEls.forEach((N, i) => { N.t.textContent = deg[i]; N.c.setAttribute('fill', deg[i] % 2 ? '#fca5a5' : '#bbf7d0'); });
    $('#s1').textContent = `Roads: ${G.used.size}/${g.edges.length}`;
    $('#s2').textContent = G.showDeg ? `Odd nodes: ${G.odd.length}` : '';
  } else if (mode === 'color') {
    let conflicts = 0;
    g.edges.forEach(([a, b], i) => { if (G.col[a] >= 0 && G.col[a] === G.col[b]) { E(i, 'var(--bad)', 3); conflicts++; } });
    G.conflicts = conflicts;
    G.nodeEls.forEach((N, i) => {
      if (G.col[i] >= 0) { N.c.setAttribute('fill', COLORS[G.col[i]]); N.t.textContent = G.col[i] + 1; }
    });
    $('#s1').textContent = `Colors allowed: ${G.k}`;
    $('#s2').textContent = conflicts ? `Clashes: ${conflicts}` : `Painted: ${G.col.filter(c => c >= 0).length}/${n}`;
  } else if (mode === 'path') {
    const p = G.path;
    for (let i = 1; i < p.length; i++) E(eIdx(p[i - 1], p[i]), 'var(--accent)', 3);
    G.nodeEls[g.s].c.setAttribute('fill', 'var(--good)'); G.nodeEls[g.t].c.setAttribute('fill', 'var(--bad)');
    p.forEach(v => { if (v !== g.s && v !== g.t) G.nodeEls[v].c.setAttribute('fill', 'var(--accent)'); });
    G.nodeEls[p[p.length - 1]].halo.setAttribute('stroke', 'var(--accent)');
    G.cost = pathCost();
    $('#s1').textContent = `Cost so far: ${G.cost}`;
    $('#s2').textContent = '';
  } else {
    let cost = 0;
    G.sel.forEach(i => { E(i, 'var(--good)', 3); cost += g.edges[i][2]; });
    G.cost = cost;
    if (G.hintEdge !== undefined && !G.sel.has(G.hintEdge)) E(G.hintEdge, 'var(--warn)', 3);
    $('#s1').textContent = `Edges: ${G.sel.size}/${n - 1}`;
    $('#s2').textContent = `Cost: ${cost}`;
  }
  $('#undo').disabled = !G.hist.length || G.done;
}
function pathCost() {
  let c = 0;
  for (let i = 1; i < G.path.length; i++) {
    const a = G.path[i - 1], b = G.path[i];
    c += G.edges.find(([x, y]) => (x === a && y === b) || (x === b && y === a))[2];
  }
  return c;
}

// ----- input -----
function tapNode(v) {
  if (G.done) return;
  say('');
  const {mode} = G;
  if (mode === 'euler') {
    if (!G.path.length) { G.path.push(v); G.hist.push(null); buzz(10); }
    else {
      const cur = G.path[G.path.length - 1];
      const e = G.edges.findIndex(([a, b], i) => !G.used.has(i) && ((a === cur && b === v) || (a === v && b === cur)));
      if (v === cur) {}
      else if (e < 0) { say('No unused road between those nodes.', true); }
      else { G.used.add(e); G.path.push(v); G.hist.push(e); G.moves++; buzz(10); }
    }
    if (G.used.size === G.edges.length) win();
  } else if (mode === 'color') {
    G.col[v] = G.col[v] + 1 >= G.k ? -1 : G.col[v] + 1;
    G.hist.push([v, G.col[v] === -1 ? G.k - 1 : G.col[v] - 1]); G.moves++; buzz(10);
    render();
    if (G.col.every(c => c >= 0) && G.conflicts === 0) win();
    return;
  } else if (mode === 'path') {
    const p = G.path, cur = p[p.length - 1];
    if (v === cur) {}
    else if (p.length > 1 && v === p[p.length - 2]) { p.pop(); G.hist.pop(); }
    else if (cur === G.g.t) say('You are already at the goal. Undo to try another route.', true);
    else if (p.includes(v)) say('A route should not revisit a node.', true);
    else if (!G.edges.some(([a, b]) => (a === cur && b === v) || (a === v && b === cur))) say('Those nodes are not joined.', true);
    else { p.push(v); G.hist.push(v); G.moves++; buzz(10); }
    render();
    if (p[p.length - 1] === G.g.t) {
      if (pathCost() === G.best.cost) win();
      else { G.mistakes++; say(`Cost ${pathCost()}. A cheaper route exists. Undo and try again.`); }
    }
    return;
  }
  render();
}
function tapEdge(i) {
  if (G.done) return;
  say(''); G.hintEdge = undefined;
  if (G.sel.has(i)) { G.sel.delete(i); G.hist.push(i); render(); return; }
  const p = Array.from({length: G.n}, (_, k) => k);
  G.sel.forEach(j => { p[find(p, G.edges[j][0])] = find(p, G.edges[j][1]); });
  if (find(p, G.edges[i][0]) === find(p, G.edges[i][1])) { say('That would close a loop.', true); return; }
  G.sel.add(i); G.hist.push(i); G.moves++; buzz(10);
  render();
  if (G.sel.size === G.n - 1) {
    if (G.cost === G.best.cost) win();
    else { G.mistakes++; say(`A valid network costing ${G.cost}, but a cheaper one exists.`); }
  }
}

$('#undo').onclick = () => {
  if (!G || G.done || !G.hist.length) return;
  say(''); const h = G.hist.pop(), m = G.mode;
  if (m === 'euler') { if (h !== null) G.used.delete(h); G.path.pop(); }
  else if (m === 'color') { G.col[h[0]] = h[1]; }
  else if (m === 'path') { G.path.pop(); }
  else { if (G.sel.has(h)) G.sel.delete(h); else G.sel.add(h); }
  render();
};
$('#reset').onclick = () => { if (G) start(G.mode, G.idx); };
$('#back').onclick = () => { buildMenu(); show('menu'); };
$('#extra').onclick = () => {
  if (!G || G.done || G.mode !== 'euler') return;
  if (!G.possible) win('Correct! This graph has ' + G.odd.length + ' odd nodes (' + G.odd.map(LET).join(', ') + '), and more than 2 means no walk can exist.');
  else { G.mistakes++; say(`Not so fast: only ${G.odd.length} odd nodes, so a walk exists.`, true); }
};
$('#hint').onclick = () => {
  if (!G || G.done) return;
  const m = G.mode;
  if (m === 'euler') { G.showDeg = !G.showDeg; render(); say(G.showDeg ? 'Numbers show how many roads meet at each node.' : ''); return; }
  G.mistakes++;
  if (m === 'color') {
    const adj = adjacency(G.n, G.edges), v = [...Array(G.n).keys()].sort((a, b) => adj[b].length - adj[a].length)[0];
    say(`Start with ${LET(v)}: it touches ${adj[v].length} others.`);
  } else if (m === 'path') {
    const nxt = G.best.path[Math.min(G.path.length, G.best.path.length - 1)];
    say(`The best route goes through ${G.best.path.map(LET).join(' → ')}.`);
  } else {
    const chosen = Array.from({length: G.n}, (_, k) => k);
    G.sel.forEach(j => { chosen[find(chosen, G.edges[j][0])] = find(chosen, G.edges[j][1]); });
    const order = G.edges.map((e, i) => i).sort((a, b) => G.edges[a][2] - G.edges[b][2]);
    const nxt = order.find(i => !G.sel.has(i) && find(chosen, G.edges[i][0]) !== find(chosen, G.edges[i][1]));
    G.hintEdge = nxt; render(); say('The yellow edge is the cheapest one that makes no loop.');
  }
};

// ----- win -----
function win(customText) {
  G.done = true; render(); buzz([30, 40, 60]);
  let stars;
  if (G.mode === 'color') stars = G.moves <= 2 * G.n ? 3 : G.moves <= 3 * G.n ? 2 : 1;
  else stars = 3 - Math.min(2, G.mistakes);
  const prog = save.get(), key = G.mode + G.idx;
  if ((prog[key] || 0) < stars) { prog[key] = stars; save.set(prog); }
  $('#wstars').textContent = '★'.repeat(stars) + '☆'.repeat(3 - stars);
  const M = MODES[G.mode];
  let extra = '';
  if (G.mode === 'euler' && G.possible) extra = G.odd.length ? `Start and end: ${G.odd.map(LET).join(' and ')} (the odd nodes). ` : 'Every node is even, so the walk returns to its start. ';
  if (G.mode === 'path') extra = `Cheapest cost: ${G.best.cost}. `;
  if (G.mode === 'mst') extra = `Minimum cost: ${G.best.cost}. `;
  if (G.mode === 'color') extra = `Chromatic number: ${G.k}. `;
  $('#wtitle').textContent = 'Solved!';
  $('#wtext').textContent = (customText ? customText + ' ' : extra) + M.concept;
  const last = G.idx === M.levels.length - 1;
  $('#wnext').textContent = last ? 'Menu' : 'Next ▶';
  $('#win').classList.add('on');
}
$('#wnext').onclick = () => {
  const M = MODES[G.mode];
  if (G.idx === M.levels.length - 1) { $('#win').classList.remove('on'); buildMenu(); show('menu'); }
  else start(G.mode, G.idx + 1);
};
$('#wagain').onclick = () => start(G.mode, G.idx);
$('#wmenu').onclick = () => { $('#win').classList.remove('on'); buildMenu(); show('menu'); };

// ----- menu actions -----
$('#shareBtn').onclick = async () => {
  const data = {title: 'Graph Quest', text: 'Try these graph theory puzzles on your phone!', url: location.href};
  try {
    if (navigator.share) await navigator.share(data);
    else { await navigator.clipboard.writeText(location.href); alert('Link copied!'); }
  } catch (e) {}
};
$('#resetAll').onclick = () => { if (confirm('Erase all stars?')) { save.set({}); buildMenu(); } };

buildMenu();
</script>
</body>
