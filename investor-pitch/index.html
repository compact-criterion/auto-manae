<style>

:root{
  --paper:#f7f4f2; --surface:#ffffff; --ink:#2a1219; --muted:#6a5257; --grid:#ece2df; --grid-strong:#d8c8c4;
  --navy:#4a1d2f; --on-navy:#ffffff; --hl:#a65a00; --hl-ink:#ffffff; --hl-soft:#fbefdc;
  --bio:#2e7d32; --rec:#1f5fbf; --res:#6d5a4b; --curve:#1f5fbf; --shade:rgba(181,82,27,.35); --bar:#3b8f88;
  --good:#1f7a43; --good-soft:#e2f4e8; --bad:#b3261e; --bad-soft:#fbe5e3; --btn-border:#4a1d2f;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;

}

  --bio:#7fd37f; --rec:#7fa4ff; --res:#cdb7a3; --curve:#7fa4ff; --shade:rgba(255,154,95,.35); --bar:#5fc2b9;
  --good:#6fd394; --good-soft:#15301f; --bad:#ff8a80; --bad-soft:#3a1714; --btn-border:#6a4552;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0c1615; --surface:#132220; --ink:#e3efed; --muted:#9fb6b2; --grid:#1b2c2a; --grid-strong:#2c4441;
  --navy:#112e2e; --on-navy:#ffffff; --hl:#ff9a5f; --hl-ink:#2a1200; --hl-soft:#3a2317;
  --bio:#7fd37f; --rec:#7fa4ff; --res:#cdb7a3; --curve:#7fa4ff; --shade:rgba(255,154,95,.35); --bar:#5fc2b9;

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.app{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:var(--on-navy);box-shadow:0 2px 10px rgba(0,0,0,.18)}
header.app .wrap{padding-block:10px 8px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:1.3rem;margin:0}
.brand small{font-size:.78rem;opacity:.8;letter-spacing:.06em;text-transform:uppercase}
.steps{display:flex;gap:6px;overflow-x:auto;padding-block:8px 2px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps a{flex:0 0 auto;min-width:44px;height:40px;padding:0 12px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:20px;color:var(--on-navy);text-decoration:none;font-weight:700;border:1.5px solid rgba(255,255,255,.35);font-size:.95rem}
.steps a.on{background:var(--hl);border-color:var(--hl);color:var(--hl-ink)}
.steps a .dot{width:7px;height:7px;border-radius:50%;background:#7be09e}
main .wrap{padding-block:18px 110px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--hl);font-weight:700}
h2{font-family:var(--f-display);font-weight:800;font-size:1.75rem;line-height:1.15;margin:2px 0 0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:1.18rem;margin:0 0 4px;text-wrap:balance}
p{margin:0}
.lead{color:var(--muted)}
.tag{display:inline-block;font-size:.76rem;font-weight:700;padding:2px 8px;border-radius:8px;margin-right:4px;vertical-align:middle}
.tag.m{background:#e5edfd;color:#1f4fa8} .tag.g{background:#fbe9de;color:#9a4214}
:root[data-theme="dark"] .tag.m{background:#1b2950;color:#a9c2ff} :root[data-theme="dark"] .tag.g{background:#3a2317;color:#ffb98f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.m{background:#1b2950;color:#a9c2ff} :root:not([data-theme="light"]) .tag.g{background:#3a2317;color:#ffb98f}}
.card{background:var(--surface);border:1px solid var(--grid-strong);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}

.example{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--hl-soft);border:1.5px dashed var(--hl);border-radius:var(--r);padding:12px 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.92rem;min-width:0}
label .hint{font-weight:400;color:var(--muted);font-size:.85rem}
input[type=text],input[type=number],input[type=password],textarea,select{font:inherit;font-weight:400;color:var(--ink);background:var(--paper);border:1.5px solid var(--grid-strong);border-radius:10px;padding:10px 12px;width:100%;min-height:46px}
textarea{min-height:200px;resize:vertical;line-height:1.6}
textarea.short{min-height:90px}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.unit{position:relative}
.unit input{padding-right:52px}
.unit::after{content:attr(data-u);position:absolute;right:12px;bottom:11px;color:var(--muted);font-weight:700}
.peso{position:relative}
.peso::before{content:"₱";position:absolute;left:12px;bottom:11px;color:var(--muted);font-weight:700}
.peso input{padding-left:28px}
button,a.btn{font:inherit;font-weight:700;border-radius:10px;border:1.5px solid var(--btn-border);background:var(--surface);color:var(--ink);padding:10px 16px;min-height:46px;cursor:pointer}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
button.primary{background:var(--navy);color:var(--on-navy);border-color:var(--btn-border)}
button.small{min-height:38px;padding:6px 12px;font-size:.9rem}
button.x{min-height:36px;min-width:36px;padding:4px 8px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button[aria-pressed=true]{background:var(--hl);border-color:var(--hl);color:var(--hl-ink)}
.math{font-family:var(--f-mono);font-size:.95rem;background:var(--paper);border-radius:10px;padding:12px 14px;overflow-x:auto;white-space:pre;line-height:1.75;border:1px solid var(--grid)}
.eq{font-family:var(--f-mono);font-weight:600;font-size:1.1rem;overflow-x:auto}
code{font-family:var(--f-mono);font-size:.88rem;background:var(--paper);border:1px solid var(--grid);border-radius:6px;padding:1px 6px;white-space:nowrap}
.v{font-style:italic;font-family:Georgia,"Times New Roman",serif;font-weight:700}
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--grid-strong);padding:7px 9px;text-align:center}
th{background:var(--paper);font-size:.88rem}
td.l,th.l{text-align:left}
td.calc{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);text-align:left;white-space:nowrap}
table.rub td{text-align:left;vertical-align:top} table.rub td:last-child{text-align:center;white-space:nowrap}
table.dense td,table.dense th{padding:4px 6px;font-size:.85rem}
.dense input{min-height:36px;padding:4px 6px;width:58px}
.figure{overflow-x:auto}
.figure svg{display:block;width:100%;height:auto;min-width:300px}
svg text{font-family:var(--f-body)}
.pill{display:inline-block;padding:3px 10px;border-radius:12px;font-weight:700;font-size:.86rem;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.hl{background:var(--hl-soft);color:var(--hl)}
.big{font-family:var(--f-display);font-weight:800;font-size:1.45rem;line-height:1.2}
ul.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.check label{flex-direction:row;align-items:flex-start;gap:10px;font-weight:400;font-size:.98rem}
ul.check input{width:22px;height:22px;flex:0 0 auto;margin-top:2px;accent-color:var(--navy)}
.timeline{display:flex;flex-direction:column;gap:10px}
.tl{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:var(--r);border:1px solid var(--grid-strong);background:var(--surface)}
.tl .d{font-family:var(--f-display);font-weight:800;line-height:1.1;text-align:center}
.tl .d b{display:block;font-size:1.5rem}
.tl.next{border:2px solid var(--hl);background:var(--hl-soft)}
.bar{height:10px;border-radius:5px;background:var(--grid);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good);border-radius:5px}
.prog{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.prog a{font-weight:700;color:var(--ink)}
blockquote{margin:0;padding:14px 16px;border-left:5px solid var(--hl);background:var(--hl-soft);border-radius:0 var(--r) var(--r) 0;font-style:italic;font-size:1.05rem}
details.card>summary,details.sub>summary{cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:1.1rem;list-style-position:inside}
.teacher-tag{display:inline-block;background:var(--ink);color:var(--paper);border-radius:8px;padding:2px 8px;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.member{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:8px}
.src{border:1px solid var(--grid-strong);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.timer{font-family:var(--f-mono);font-size:3rem;font-weight:600;text-align:center;line-height:1}
.segbar{display:flex;gap:4px}
.segbar span{flex:1;height:10px;border-radius:5px;background:var(--grid)}
.segbar span.done{background:var(--good)} .segbar span.now{background:var(--hl)}
nav.pager{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--grid-strong);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.pager .wrap{display:flex;justify-content:space-between;gap:10px;padding-block:10px}
nav.pager button{flex:1}
.warn{color:var(--bad);font-weight:700}
.muted{color:var(--muted)}
.count{font-size:.88rem;color:var(--muted)}
.math[data-tex]{white-space:normal;font-family:var(--f-body);font-size:1.02rem;line-height:1.4}
.math mjx-container[display="true"]{margin:0!important;text-align:left!important}
td.calc[data-tex]{white-space:nowrap}
.eq[data-tex]{font-size:1.1rem}
mjx-container{color:inherit}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:20px;font-weight:700;z-index:20}
@media (prefers-reduced-motion: no-preference){.view{animation:rise .25s ease-out}@keyframes rise{from{transform:translateY(6px)}to{transform:none}}}
</style>

var TX_SYM={"−":"-","×":"\\times ","÷":"\\div ","≤":"\\le ","≥":"\\ge ","≠":"\\ne ","≈":"\\approx ","±":"\\pm ","∪":"\\cup ","∩":"\\cap ","′":"'","|":"\\mid ","✓":"\\;\\checkmark","✗":"","·":"\\cdot ","→":"\\rightarrow ","…":"\\ldots ","%":"\\%","₱":"\\text{₱}","&":"\\&","#":"\\#","{":"\\{","}":"\\}","$":"\\$","°":"^\\circ ","\\":"\\backslash ",

/* "[A] / (B)", "x / [B]", "(A) / σ" become stacked fractions */
function txGroupFrac(s){

    if(s[a]===")"||s[a]==="]"){var op=s[a]===")"?"(":"[",d=0;for(var k=a;k>=0;k--){if(s[k]===s[a])d++;else if(s[k]===op){d--;if(!d){st=k;break;}}}

    return s.slice(0,st)+"\u0001"+s.slice(st,endA+1)+"\u0002"+s.slice(b,cl+1)+"\u0003"+txGroupFrac(s.slice(cl+1));

function txStrip(g){g=g.trim();if(/^[(\[]/.test(g)&&txMatch(g,0,g[0],g[0]==="("?")":"]")===g.length-1)return g.slice(1,-1);return g;}

    if(c==="\u0001"){var e2=s.indexOf("\u0002",i),e3=s.indexOf("\u0003",i);r+="\\dfrac{"+toTex(txStrip(s.slice(i+1,e2)))+"}{"+toTex(txStrip(s.slice(e2+1,e3)))+"}";i=e3+1;continue;}

      if(/^(m|cm|mm|km|kg|g|L)$/.test(w)&&/\d\s$/.test(s.slice(Math.max(0,i-2),i))&&!/[A-Za-z(]/.test(nx)){r+="\\,\\text{"+w+"}";i+=w.length;continue;}

        if(mm2&&mm2[2].length>1&&!TX_FN[mm2[2]]&&!/^(kg|cm|mm|km)$/.test(mm2[2])){run+=mm2[1]+mm2[2];j+=mm2[0].length;}else break;}
      var tp=s.slice(j).match(/^[,.:;?!]+/);if(tp){run+=tp[0];j+=tp[0].length;}
      var pre=(i>0&&/\s/.test(s[i-1])&&r.trim()!=="")?" ":"",post=/\s/.test(s[j]||"")&&s.slice(j).trim()!==""?" ":"";
      r+="\\text{"+pre+txText(run)+post+"}";i=j;continue;}

      r+="\\sqrt{\\ }";i++;continue;}

function mathify(root){
  if(!(window.MathJax&&MathJax.typeset)||!root)return;
  var els=root.querySelectorAll(".math,.eq,td.calc,.mx"),any=false;
  Array.prototype.forEach.call(els,function(el){
    if(el.getAttribute("data-tex"))return;
    var plain=(el.innerText||el.textContent||"").replace(/ /g," ").replace(/\s+$/,"");if(!plain.trim())return;
    var lines=plain.split("\n"),tex;
    if(el.classList.contains("math")){tex="\\[\\begin{aligned}"+lines.map(function(l){if(!l.trim())return "&\\phantom{0}";return "&"+toTex(l).replace(/^\s*-/,"{-}");}).join("\\\\")+"\\end{aligned}\\]";}

var viewEl=document.getElementById("view"),stepsEl=document.getElementById("steps");
function renderSteps(){
  stepsEl.innerHTML=ORDER.map(function(k){var done=k!=="plan"&&partProgress(k)===1;return '<a href="#'+k+'"'+(k===cur?' class="on" aria-current="page"':'')+(k==="part-d"?' aria-label="Financial plan"':'')+'>'+LABEL[k]+(done?'<span class="dot" aria-label="done"></span>':'')+'</a>';}).join("");
  var on=stepsEl.querySelector(".on");if(on&&on.scrollIntoView)on.scrollIntoView({block:"nearest",inline:"center"});
}
function renderLive(){var v=viewFor(cur);["live","live2","live3","live4","live5","live6","live7"].forEach(function(id){if(!v[id])return;var h=v[id]();var el=document.getElementById(id);if(el&&h!==null)el.innerHTML=h;});mathify(viewEl);}

  if(!VIEWS[k])k="plan";cur=k;var v=viewFor(k);
  viewEl.innerHTML='<div class="view" style="display:flex;flex-direction:column;gap:16px">'+v.stat()+'</div>';
  ["ivList","ideaTable","testList"].forEach(function(h){if(v[h])v[h]();});if(k==="part-e")drawTimer();
  renderLive();renderSteps();
  var i=ORDER.indexOf(k);document.getElementById("prev").disabled=i===0;
  document.getElementById("next").textContent=(i===ORDER.length-1||i<0)?"Back to Plan":"Next ›";
  window.scrollTo(0,0);

function route(){show((location.hash||"#plan").slice(1));}
window.addEventListener("hashchange",route);
document.getElementById("prev").addEventListener("click",function(){var i=ORDER.indexOf(cur);if(i<0)location.hash="plan";else if(i>0)location.hash=ORDER[i-1];});

viewEl.addEventListener("input",function(e){
  var el=e.target,k=el.getAttribute("data-k");if(!k||el.tagName==="SELECT")return;
  var v=el.value;if(el.type==="number"){var n=num(v);v=n===null?"":n;}
  set(k,v);if(/^(fin|vp|interviews|tests|ideas)/.test(k))S.example=false;save();renderLive();
  if(/^team\.members/.test(k))document.querySelectorAll("select[data-role]").forEach(function(sel){Array.prototype.forEach.call(sel.options,function(o,i){o.textContent=memberName(i);});});
});
viewEl.addEventListener("change",function(e){
  var el=e.target;
  if(el.getAttribute("data-step")){S.steps[el.getAttribute("data-step")]=el.checked;save();renderSteps();renderLive();return;}
  if(el.getAttribute("data-permit")){S.permits[el.getAttribute("data-permit")]=el.checked;save();renderLive();return;}
  if(el.getAttribute("data-role")){S.team.roles[el.getAttribute("data-role")]=Number(el.value);save();renderLive();return;}

});
viewEl.addEventListener("submit",function(e){
  if(e.target.id!=="pinForm")return;e.preventDefault();
  var inp=document.getElementById("pin"),msg=document.getElementById("pinMsg");
  var wait=Math.ceil((tcWaitUntil-Date.now())/1000);
  if(wait>0){msg.textContent="Too many tries. Wait "+wait+" seconds, then try again.";return;}
  var tries;try{tries=sha256hex("bbsi-teacher-check|"+inp.value.trim());}catch(err){tries=Promise.reject(err);}
  tries.then(function(h){
    if(h===TC_HASH){tcOpen=true;tcFails=0;try{sessionStorage.setItem("tcOpen",TC_HASH);}catch(e2){}show("teacher");toast("Teacher Check unlocked");}
    else{tcFails++;inp.value="";inp.focus();
      if(tcFails>=5){tcFails=0;tcWaitUntil=Date.now()+30000;msg.textContent="That PIN is not correct. Too many tries: wait 30 seconds.";}
      else msg.textContent="That PIN is not correct.";}
  },function(){msg.textContent="This browser cannot check the PIN. Open the app from its https:// link.";});
});
viewEl.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;

  if(b.hasAttribute("data-addfin")){var key=b.getAttribute("data-addfin");S.fin[key].push(key==="startup"?{item:"",qty:1,s1:"",s2:""}:key==="fixed"?{item:"",amt:""}:{item:"",s1:"",s2:""});save();show(cur);return;}

  if(a==="addIdea"){var s={};CRIT.forEach(function(c){s[c[0]]="";});S.ideas.push({name:"",s:s});save();VIEWS["part-a"].ideaTable();renderLive();}
  if(a==="addTest"){S.tests.push({who:"",liked:"",disliked:"",pay:""});save();VIEWS["part-b"].testList();renderLive();}
  if(a==="tPitch"||a==="tQA"){TM.mode=a==="tPitch"?0:1;TM.run=false;clearInterval(TM.iv);TM.left=TM.mode?180:300;drawTimer();}
  if(a==="tStart"){TM.run=!TM.run;clearInterval(TM.iv);if(TM.run)TM.iv=setInterval(tick,1000);drawTimer();}
  if(a==="tReset"){TM.run=false;clearInterval(TM.iv);TM.left=TM.mode?180:300;drawTimer();}
  if(a==="clear"){document.getElementById("confirmClear").hidden=false;}
  if(a==="clearNo"){document.getElementById("confirmClear").hidden=true;}
  if(a==="clearYes"){var bl=clone(EXAMPLE);bl.example=false;bl.team=S.team;bl.tc=S.tc;bl.steps=S.steps;
    bl.interviews=[{who:"",problem:"",wish:""}];bl.observe="";Object.keys(bl.fish).forEach(function(k){bl.fish[k]="";});bl.tree={effects:"",core:"",causes:""};
    var s0={};CRIT.forEach(function(c){s0[c[0]]="";});bl.ideas=[{name:"",s:s0}];
    Object.keys(bl.vp).forEach(function(k){bl.vp[k]="";});bl.proto="";bl.tests=[{who:"",liked:"",disliked:"",pay:""}];bl.changes="";
    bl.fin={startup:[{item:"",qty:1,s1:"",s2:""}],fixed:[{item:"",amt:""}],variable:[{item:"",s1:"",s2:""}],units:"",markup:"",round:1,months:["","",""],drop:30,buffer:"",sources:""};
    S=bl;save();location.hash="part-a";show("part-a");toast("Form cleared");}

});
