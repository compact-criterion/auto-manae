<!--APP-->
<title>Wise Choice Helper</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a phone-first app — sticky header with Part A–G step chips over a graph-paper ground; one part per screen; Prev/Next bar at the bottom. */
:root{
  --paper:#f5f7fb; --surface:#ffffff; --ink:#18234a; --muted:#56608a; --grid:#dfe5f2; --grid-strong:#c4cee6;
  --navy:#1d2b5e; --on-navy:#ffffff; --gold:#b8891a; --gold-soft:#fbf1d6;
  --opt1:#2257c7; --opt1-soft:#e5edfd; --opt2:#c9541a; --opt2-soft:#fdebe1;
  --good:#1f7a43; --good-soft:#e2f4e8; --bad:#b3261e; --bad-soft:#fbe5e3; --region:rgba(34,87,199,.16);
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:12px; --btn-border:#1d2b5e;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e1324; --surface:#161d35; --ink:#e7ebf7; --muted:#a2abcc; --grid:#212a47; --grid-strong:#323d63;
  --navy:#1a2550; --on-navy:#ffffff; --gold:#e3b84a; --gold-soft:#2f2813;
  --opt1:#7fa4ff; --opt1-soft:#1b2950; --opt2:#ff9a5f; --opt2-soft:#3a2317;
  --good:#6fd394; --good-soft:#15301f; --bad:#ff8a80; --bad-soft:#3a1714; --region:rgba(127,164,255,.2); --btn-border:#4a5a8c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1324; --surface:#161d35; --ink:#e7ebf7; --muted:#a2abcc; --grid:#212a47; --grid-strong:#323d63;
  --navy:#1a2550; --on-navy:#ffffff; --gold:#e3b84a; --gold-soft:#2f2813;
  --opt1:#7fa4ff; --opt1-soft:#1b2950; --opt2:#ff9a5f; --opt2-soft:#3a2317;
  --good:#6fd394; --good-soft:#15301f; --bad:#ff8a80; --bad-soft:#3a1714; --region:rgba(127,164,255,.2); --btn-border:#4a5a8c;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.app{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:var(--on-navy);box-shadow:0 2px 10px rgba(0,0,0,.18)}
header.app .wrap{padding-block:10px 8px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:1.3rem;margin:0;letter-spacing:-.01em}
.brand small{font-size:.78rem;opacity:.8;letter-spacing:.06em;text-transform:uppercase}
.steps{display:flex;gap:6px;overflow-x:auto;padding-block:8px 2px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps a{flex:0 0 auto;min-width:44px;height:40px;padding:0 12px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:20px;
  color:var(--on-navy);text-decoration:none;font-weight:700;border:1.5px solid rgba(255,255,255,.35);font-size:.95rem}
.steps a.on{background:var(--gold);border-color:var(--gold);color:#1a1405}
.steps a .dot{width:7px;height:7px;border-radius:50%;background:#7be09e}
main .wrap{padding-block:18px 110px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);font-weight:700}
h2{font-family:var(--f-display);font-weight:800;font-size:1.75rem;line-height:1.15;margin:2px 0 0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:1.18rem;margin:0 0 8px;text-wrap:balance}
p{margin:0}
.lead{color:var(--muted)}
.pts{display:inline-block;font-size:.8rem;font-weight:700;padding:2px 9px;border-radius:10px;background:var(--gold-soft);color:var(--gold);margin-left:6px;vertical-align:middle}
.card{background:var(--surface);border:1px solid var(--grid-strong);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.o1{border-top:5px solid var(--opt1)} .card.o2{border-top:5px solid var(--opt2)}
.note{background:var(--gold-soft);border-radius:var(--r);padding:12px 14px;font-size:.95rem}
.example{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--gold-soft);border:1.5px dashed var(--gold);border-radius:var(--r);padding:12px 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.92rem;min-width:0}
label .hint{font-weight:400;color:var(--muted);font-size:.85rem}
input[type=text],input[type=number],textarea,select{font:inherit;font-weight:400;color:var(--ink);background:var(--paper);border:1.5px solid var(--grid-strong);border-radius:10px;padding:10px 12px;width:100%;min-height:46px}
textarea{min-height:220px;resize:vertical;line-height:1.6}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.peso{position:relative}
.peso::before{content:"₱";position:absolute;left:12px;bottom:11px;color:var(--muted);font-weight:700}
.peso input{padding-left:28px}
button,.btn{font:inherit;font-weight:700;border-radius:10px;border:1.5px solid var(--btn-border);background:var(--surface);color:var(--ink);padding:10px 16px;min-height:46px;cursor:pointer}
button.primary{background:var(--navy);color:var(--on-navy);border-color:var(--btn-border)}
button.small{min-height:38px;padding:6px 12px;font-size:.9rem}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#1a1405}
.math{font-family:var(--f-mono);font-size:.98rem;background:var(--paper);border-radius:10px;padding:12px 14px;overflow-x:auto;white-space:pre;line-height:1.75;border:1px solid var(--grid)}
.eq{font-family:var(--f-mono);font-weight:600;font-size:1.25rem}
.o1t{color:var(--opt1)} .o2t{color:var(--opt2)}
.v{font-style:italic;font-family:Georgia,"Times New Roman",serif;font-weight:700}
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--grid-strong);padding:8px 10px;text-align:center}
th{background:var(--paper);font-size:.9rem}
td.calc{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);text-align:left}
table.rub td{text-align:left;vertical-align:top} table.rub td:last-child{text-align:center;white-space:nowrap}
.figure{overflow-x:auto}
.figure svg{display:block;width:100%;height:auto;min-width:300px}
svg text{font-family:var(--f-body)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.92rem}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:22px;height:4px;border-radius:2px}
.pill{display:inline-block;padding:3px 10px;border-radius:12px;font-weight:700;font-size:.88rem}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.o1{background:var(--opt1-soft);color:var(--opt1)} .pill.o2{background:var(--opt2-soft);color:var(--opt2)}
.big{font-family:var(--f-display);font-weight:800;font-size:1.6rem;line-height:1.2}
ul.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.check label{flex-direction:row;align-items:flex-start;gap:10px;font-weight:400;font-size:.98rem}
ul.check input{width:22px;height:22px;flex:0 0 auto;margin-top:2px;accent-color:var(--navy)}
.timeline{display:flex;flex-direction:column;gap:10px}
.tl{display:grid;grid-template-columns:86px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:var(--r);border:1px solid var(--grid-strong);background:var(--surface)}
.tl .d{font-family:var(--f-display);font-weight:800;line-height:1.1;text-align:center}
.tl .d b{display:block;font-size:1.6rem}
.tl.next{border:2px solid var(--gold);background:var(--gold-soft)}
.bar{height:10px;border-radius:5px;background:var(--grid);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good);border-radius:5px}
.prog{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.prog a{font-weight:700;color:var(--ink)}
blockquote{margin:0;padding:14px 16px;border-left:5px solid var(--gold);background:var(--gold-soft);border-radius:0 var(--r) var(--r) 0;font-style:italic;font-size:1.05rem}
.photo img{border-radius:10px;border:1px solid var(--grid-strong);max-height:320px;object-fit:contain}
nav.pager{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--grid-strong);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.pager .wrap{display:flex;justify-content:space-between;gap:10px;padding-block:10px}
nav.pager button{flex:1}
.warn{color:var(--bad);font-weight:700}
.muted{color:var(--muted)}
.count{font-size:.88rem;color:var(--muted)}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
details.card>summary{cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:1.15rem;list-style-position:inside}
.teacher-tag{display:inline-block;background:var(--ink);color:var(--paper);border-radius:8px;padding:2px 8px;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.math[data-tex]{white-space:normal;font-family:var(--f-body);font-size:1.02rem;line-height:1.4}
.math mjx-container[display="true"]{margin:0!important;text-align:left!important}
td.calc[data-tex]{white-space:nowrap}
.eq[data-tex]{font-size:1.1rem}
mjx-container{color:inherit}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:20px;font-weight:700;z-index:20}
@media (prefers-reduced-motion: no-preference){.view{animation:rise .25s ease-out}@keyframes rise{from{transform:translateY(6px)}to{transform:none}}}
</style>

<header class="app">
  <div class="wrap">
    <div class="brand"><h1>Wise Choice Helper</h1><small>Math 8 · Q3 PT</small></div>
    <nav class="steps" id="steps" aria-label="Parts of the task"></nav>
  </div>
</header>
<main><div class="wrap" id="view"></div></main>
<nav class="pager"><div class="wrap"><button id="prev" type="button">‹ Back</button><button id="next" class="primary" type="button">Next ›</button></div></nav>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
var KEY="wiseChoice.v1";
var EXAMPLE={
  example:true,
  expense:"Drinking-water delivery (5-gallon refills)",
  unit:"refill", units:"refills",
  o1:{name:"Station membership", b:150, m:25},
  o2:{name:"Regular delivery", b:30, m:37},
  budget:500, usual:12,
  source:"Price list from the water station near our house (photo attached).",
  photo:null,
  tbl:{start:0, step:5},
  showBudget:true,
  method:"sub",
  ineq:{a:25, b:37, op:"≤", c:500,
        xdef:"number of refills bought at the membership price (₱25 each)",
        ydef:"number of refills bought by regular delivery (₱37 each)",
        p1:[4,6], p2:[12,10]},
  letter:"", reflection:"", checks:{},
  tc:{who:"", unit:"use", units:"uses", o1:{b:"",m:""}, o2:{b:"",m:""}, budget:"", step:5,
      ineq:{a:"",b:"",op:"≤",c:"",p1:["",""],p2:["",""]}}
};
function clone(o){return JSON.parse(JSON.stringify(o));}
var S=load();
function load(){
  try{var t=localStorage.getItem(KEY); if(t){var o=JSON.parse(t); return Object.assign(clone(EXAMPLE),o);}}catch(e){}
  return clone(EXAMPLE);
}
var saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(function(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}},250);}

/* ---------- number helpers ---------- */
function num(v){var n=parseFloat(v);return isFinite(n)?n:null;}
function r2(n){return Math.round(n*100)/100;}
function f(n){ if(n===null||!isFinite(n)) return "?"; var x=r2(n); if(Object.is(x,-0)) x=0;
  return x.toLocaleString("en-US",{maximumFractionDigits:2});}
function peso(n){return (n<0?"−₱":"₱")+f(Math.abs(n));}
function sn(n){return n<0?"−"+f(-n):f(n);} /* signed number with real minus */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;}
/* exact quotient of two money-like decimals */
function quo(n,d){
  var N=Math.round(n*100),D=Math.round(d*100); if(D===0) return {txt:"undefined",val:NaN};
  if(D<0){N=-N;D=-D;} var g=gcd(N,D); N/=g; D/=g; var val=N/D;
  if(D===1) return {txt:sn(N),val:val,whole:true};
  var dec=val.toString().split(".")[1]||"";
  var exact=dec.length<=2;
  return {txt:(N<0?"−":"")+Math.abs(N)+"/"+D+(exact?" = "+sn(val):" ≈ "+sn(val)),val:val,whole:false};
}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function V(s){return '<span class="v">'+s+'</span>';}
/* "25x + 150" in plain text */
function lin(m,b,v){
  v=v||"x"; var s="";
  if(m!==0){ s=(m===1?"":m===-1?"−":sn(m))+v; }
  if(b!==0||m===0){ if(s) s+=(b<0?" − ":" + ")+f(Math.abs(b)); else s=sn(b); }
  return s;
}
function niceStep(range,target){
  var raw=range/(target||5), p=Math.pow(10,Math.floor(Math.log10(raw))), m=raw/p;
  var s=m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10; return s*p;
}
function niceCeil(v,step){return Math.ceil(v/step-1e-9)*step;}

/* ---------- derived model ---------- */
function nm(i){var o=i===1?S.o1:S.o2;return (o.name&&o.name.trim())||("Option "+i);}
function U(n){return n===1?(S.unit||"use"):(S.units||"uses");}
function model(){
  var m1=num(S.o1.m),b1=num(S.o1.b),m2=num(S.o2.m),b2=num(S.o2.b),B=num(S.budget),usual=num(S.usual);
  var M={m1:m1,b1:b1,m2:m2,b2:b2,B:B,usual:usual,ok:[m1,b1,m2,b2].every(function(v){return v!==null;})};
  if(!M.ok) return M;
  if(r2(m1)===r2(m2)){ M.kind=r2(b1)===r2(b2)?"dependent":"inconsistent"; }
  else{
    M.kind="independent";
    M.qx=quo(b2-b1,m1-m2); M.bx=M.qx.val; M.by=m1*M.bx+b1;
  }
  /* which is cheaper for small x (just above 0) */
  M.y1=function(x){return m1*x+b1;}; M.y2=function(x){return m2*x+b2;};
  if(B!==null){
    M.max1=m1>0?(B-b1)/m1:null; M.max2=m2>0?(B-b2)/m2:null;
  }
  return M;
}

/* ---------- SVG: two lines ---------- */
function graphLines(M,opts){
  opts=opts||{};
  var W=380,H=320,L=58,R=18,T=18,Bm=46,pw=W-L-R,ph=H-T-Bm;
  var xNeed=10;
  if(M.kind==="independent"&&M.bx>0) xNeed=Math.max(xNeed,M.bx*1.8);
  if(M.usual) xNeed=Math.max(xNeed,M.usual*1.2);
  if(M.max1>0) xNeed=Math.max(xNeed,Math.min(M.max1*1.1,xNeed*3));
  var xs=niceStep(xNeed,5), xMax=niceCeil(xNeed,xs);
  var yNeed=Math.max(M.y1(xMax),M.y2(xMax),M.b1,M.b2,(opts.budget&&M.B)?M.B*1.08:0,1);
  var ys=niceStep(yNeed,5), yMax=niceCeil(yNeed,ys);
  function X(x){return L+x/xMax*pw;} function Y(y){return T+ph-(y/yMax)*ph;}
  var g=[];
  g.push('<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Graph of both cost equations">');
  g.push('<rect x="'+L+'" y="'+T+'" width="'+pw+'" height="'+ph+'" fill="var(--surface)" stroke="var(--grid-strong)"/>');
  /* minor grid */
  for(var i=0;i<=10;i++){var gx=L+pw*i/10, gy=T+ph*i/10;
    g.push('<line x1="'+gx+'" y1="'+T+'" x2="'+gx+'" y2="'+(T+ph)+'" stroke="var(--grid)" stroke-width="1"/>');
    g.push('<line x1="'+L+'" y1="'+gy+'" x2="'+(L+pw)+'" y2="'+gy+'" stroke="var(--grid)" stroke-width="1"/>');}
  for(var x=0;x<=xMax+1e-9;x+=xs){g.push('<line x1="'+X(x)+'" y1="'+T+'" x2="'+X(x)+'" y2="'+(T+ph)+'" stroke="var(--grid-strong)"/><text x="'+X(x)+'" y="'+(T+ph+18)+'" text-anchor="middle" font-size="12" fill="var(--muted)">'+f(x)+'</text>');}
  for(var y=0;y<=yMax+1e-9;y+=ys){g.push('<line x1="'+L+'" y1="'+Y(y)+'" x2="'+(L+pw)+'" y2="'+Y(y)+'" stroke="var(--grid-strong)"/><text x="'+(L-6)+'" y="'+(Y(y)+4)+'" text-anchor="end" font-size="12" fill="var(--muted)">'+f(y)+'</text>');}
  g.push('<line x1="'+L+'" y1="'+(T+ph)+'" x2="'+(L+pw)+'" y2="'+(T+ph)+'" stroke="var(--ink)" stroke-width="2"/><line x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+(T+ph)+'" stroke="var(--ink)" stroke-width="2"/>');
  g.push('<text x="'+(L+pw/2)+'" y="'+(H-6)+'" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">x = number of '+esc(U(2))+' per month</text>');
  g.push('<text transform="translate(14 '+(T+ph/2)+') rotate(-90)" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">y = total monthly cost (₱)</text>');
  g.push('<clipPath id="cp'+(opts.id||"")+'"><rect x="'+L+'" y="'+T+'" width="'+pw+'" height="'+ph+'"/></clipPath>');
  if(opts.budget&&M.B!==null&&M.B<=yMax){
    g.push('<line x1="'+L+'" y1="'+Y(M.B)+'" x2="'+(L+pw)+'" y2="'+Y(M.B)+'" stroke="var(--gold)" stroke-width="2" stroke-dasharray="7 5"/>');
    g.push('<text x="'+(L+30)+'" y="'+(Y(M.B)-6)+'" text-anchor="start" font-size="12" font-weight="700" fill="var(--gold)">budget ₱'+f(M.B)+'</text>');
  }
  g.push('<g clip-path="url(#cp'+(opts.id||"")+')">');
  g.push('<line x1="'+X(0)+'" y1="'+Y(M.b1)+'" x2="'+X(xMax)+'" y2="'+Y(M.y1(xMax))+'" stroke="var(--opt1)" stroke-width="3.5" stroke-linecap="round"/>');
  g.push('<line x1="'+X(0)+'" y1="'+Y(M.b2)+'" x2="'+X(xMax)+'" y2="'+Y(M.y2(xMax))+'" stroke="var(--opt2)" stroke-width="3.5" stroke-linecap="round"'+(M.kind==="dependent"?' stroke-dasharray="8 6"':'')+'/>');
  g.push('</g>');
  /* y-intercepts */
  var sep=Math.abs(Y(M.b1)-Y(M.b2))<16;
  g.push('<circle cx="'+X(0)+'" cy="'+Y(M.b1)+'" r="5" fill="var(--opt1)" stroke="var(--surface)" stroke-width="2"/>');
  g.push('<circle cx="'+X(0)+'" cy="'+Y(M.b2)+'" r="5" fill="var(--opt2)" stroke="var(--surface)" stroke-width="2"/>');
  var up1=M.b1>=M.b2;
  g.push('<text x="'+(X(0)+9)+'" y="'+(Y(M.b1)+(up1?-8:16)+(sep&&!up1?4:0))+'" font-size="12" font-weight="700" fill="var(--opt1)">(0, '+f(M.b1)+')</text>');
  if(M.kind!=="dependent") g.push('<text x="'+(X(0)+9)+'" y="'+(Y(M.b2)+(up1?16:-8)+(sep&&up1?4:0))+'" font-size="12" font-weight="700" fill="var(--opt2)">(0, '+f(M.b2)+')</text>');
  /* line labels at right end */
  var e1=Math.min(Math.max(Y(M.y1(xMax*0.86)),T+12),T+ph-6), e2=Math.min(Math.max(Y(M.y2(xMax*0.86)),T+12),T+ph-6);
  var lab1=e1<e2?-10:18, lab2=e1<e2?18:-10;
  g.push('<text x="'+X(xMax*0.86)+'" y="'+(e1+lab1)+'" text-anchor="middle" font-size="12" font-weight="700" fill="var(--opt1)">'+esc(nm(1))+'</text>');
  if(M.kind!=="dependent") g.push('<text x="'+X(xMax*0.86)+'" y="'+(e2+lab2)+'" text-anchor="middle" font-size="12" font-weight="700" fill="var(--opt2)">'+esc(nm(2))+'</text>');
  /* break-even */
  if(M.kind==="independent"&&M.bx>=0&&M.bx<=xMax&&M.by>=0&&M.by<=yMax){
    var bx=X(M.bx),by=Y(M.by);
    g.push('<line x1="'+bx+'" y1="'+by+'" x2="'+bx+'" y2="'+(T+ph)+'" stroke="var(--ink)" stroke-dasharray="3 4"/>');
    g.push('<line x1="'+L+'" y1="'+by+'" x2="'+bx+'" y2="'+by+'" stroke="var(--ink)" stroke-dasharray="3 4"/>');
    g.push('<circle cx="'+bx+'" cy="'+by+'" r="7" fill="var(--gold)" stroke="var(--ink)" stroke-width="2"/>');
    var right=bx<L+pw*0.6;
    g.push('<text x="'+(bx+(right?12:-12))+'" y="'+(by+(M.y1(M.bx*1.2)>M.y2(M.bx*1.2)?20:-12))+'" text-anchor="'+(right?"start":"end")+'" font-size="13" font-weight="800" fill="var(--ink)">break-even ('+f(M.bx)+', '+f(M.by)+')</text>');
  }
  g.push('</svg>');
  return {svg:g.join(""),xMax:xMax,yMax:yMax,xs:xs,ys:ys};
}

/* ---------- SVG: number line for x ≤ k (x ≥ 0) ---------- */
function numberLine(k,color){
  var W=380,H=74,L=20,R=26,pw=W-L-R,y=34;
  var top=Math.max(k*1.25,5), st=niceStep(top,top<=20?top:8); if(top<=20) st=1;
  var max=niceCeil(top,st); function X(x){return L+x/max*pw;}
  var g=['<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Number line">'];
  g.push('<line x1="'+(L-8)+'" y1="'+y+'" x2="'+(W-6)+'" y2="'+y+'" stroke="var(--ink)" stroke-width="2"/>');
  g.push('<path d="M'+(W-6)+' '+y+' l-9 -5 v10z" fill="var(--ink)"/>');
  for(var x=0;x<=max+1e-9;x+=st){g.push('<line x1="'+X(x)+'" y1="'+(y-6)+'" x2="'+X(x)+'" y2="'+(y+6)+'" stroke="var(--ink)"/><text x="'+X(x)+'" y="'+(y+24)+'" text-anchor="middle" font-size="12" fill="var(--muted)">'+f(x)+'</text>');}
  if(k>=0){
    g.push('<line x1="'+X(0)+'" y1="'+y+'" x2="'+X(k)+'" y2="'+y+'" stroke="'+color+'" stroke-width="7" stroke-linecap="round"/>');
    g.push('<circle cx="'+X(0)+'" cy="'+y+'" r="7" fill="'+color+'" stroke="var(--surface)" stroke-width="2"/>');
    g.push('<circle cx="'+X(k)+'" cy="'+y+'" r="8" fill="'+color+'" stroke="var(--surface)" stroke-width="2"/>');
    g.push('<text x="'+X(k)+'" y="'+(y-14)+'" text-anchor="middle" font-size="13" font-weight="800" fill="'+color+'">'+f(k)+'</text>');
  }
  g.push('</svg>'); return g.join("");
}

/* ---------- SVG: half-plane ax + by ? c in quadrant I ---------- */
function okOp(op,val,c){return op==="≤"?val<=c+1e-9:op==="<"?val<c-1e-9:op==="≥"?val>=c-1e-9:val>c+1e-9;}
function clipPoly(P,a,b,c,keepLess){
  var out=[]; function inside(p){var v=a*p[0]+b*p[1]-c;return keepLess?v<=1e-9:v>=-1e-9;}
  for(var i=0;i<P.length;i++){var A=P[i],Bp=P[(i+1)%P.length],ia=inside(A),ib=inside(Bp);
    if(ia) out.push(A);
    if(ia!==ib){var fa=a*A[0]+b*A[1]-c, fb=a*Bp[0]+b*Bp[1]-c, t=fa/(fa-fb); out.push([A[0]+t*(Bp[0]-A[0]),A[1]+t*(Bp[1]-A[1])]);}}
  return out;
}
function graphIneq(I,pts){
  var a=num(I.a),b=num(I.b),c=num(I.c); if(a===null||b===null||c===null||(a===0&&b===0)) return "";
  var W=380,H=330,L=50,R=18,T=18,Bm=46,pw=W-L-R,ph=H-T-Bm;
  var xn=a>0&&c>0?c/a*1.25:10, yn=b>0&&c>0?c/b*1.25:10;
  pts.forEach(function(p){if(p){xn=Math.max(xn,p[0]*1.15);yn=Math.max(yn,p[1]*1.15);}});
  var xs=niceStep(xn,5),ys=niceStep(yn,5),xMax=niceCeil(xn,xs),yMax=niceCeil(yn,ys);
  function X(x){return L+x/xMax*pw;} function Y(y){return T+ph-(y/yMax)*ph;}
  var g=['<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Graph of the budget inequality">'];
  g.push('<rect x="'+L+'" y="'+T+'" width="'+pw+'" height="'+ph+'" fill="var(--surface)" stroke="var(--grid-strong)"/>');
  for(var x=0;x<=xMax+1e-9;x+=xs) g.push('<line x1="'+X(x)+'" y1="'+T+'" x2="'+X(x)+'" y2="'+(T+ph)+'" stroke="var(--grid)"/><text x="'+X(x)+'" y="'+(T+ph+18)+'" text-anchor="middle" font-size="12" fill="var(--muted)">'+f(x)+'</text>');
  for(var y=0;y<=yMax+1e-9;y+=ys) g.push('<line x1="'+L+'" y1="'+Y(y)+'" x2="'+(L+pw)+'" y2="'+Y(y)+'" stroke="var(--grid)"/><text x="'+(L-6)+'" y="'+(Y(y)+4)+'" text-anchor="end" font-size="12" fill="var(--muted)">'+f(y)+'</text>');
  var rect=[[0,0],[xMax,0],[xMax,yMax],[0,yMax]];
  var keepLess=(I.op==="≤"||I.op==="<");
  var poly=clipPoly(rect,a,b,c,keepLess);
  if(poly.length>2) g.push('<polygon points="'+poly.map(function(p){return X(p[0])+","+Y(p[1]);}).join(" ")+'" fill="var(--region)" stroke="none"/>');
  /* boundary segment inside window */
  var seg=[]; [[0,null],[xMax,null],[null,0],[null,yMax]].forEach(function(e){
    if(e[0]!==null&&b!==0){var yy=(c-a*e[0])/b; if(yy>=-1e-9&&yy<=yMax+1e-9) seg.push([e[0],yy]);}
    if(e[1]!==null&&a!==0){var xx=(c-b*e[1])/a; if(xx>=-1e-9&&xx<=xMax+1e-9) seg.push([xx,e[1]]);}
  });
  if(seg.length>=2){
    var dash=(I.op==="<"||I.op===">")?' stroke-dasharray="9 6"':'';
    g.push('<line x1="'+X(seg[0][0])+'" y1="'+Y(seg[0][1])+'" x2="'+X(seg[1][0])+'" y2="'+Y(seg[1][1])+'" stroke="var(--opt1)" stroke-width="3.5"'+dash+'/>');
  }
  if(b!==0&&c/b>=0&&c/b<=yMax) g.push('<text x="'+(X(0)+8)+'" y="'+(Y(c/b)-6)+'" font-size="12" font-weight="700" fill="var(--opt1)">(0, '+f(c/b)+')</text>');
  if(a!==0&&c/a>=0&&c/a<=xMax) g.push('<text x="'+(X(c/a)-4)+'" y="'+(Y(0)-8)+'" text-anchor="end" font-size="12" font-weight="700" fill="var(--opt1)">('+f(c/a)+', 0)</text>');
  pts.forEach(function(p,i){ if(!p) return; var ok=okOp(I.op,a*p[0]+b*p[1],c);
    g.push('<circle cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="7" fill="'+(ok?"var(--good)":"var(--bad)")+'" stroke="var(--surface)" stroke-width="2"/>');
    g.push('<text x="'+(X(p[0])+10)+'" y="'+(Y(p[1])-8)+'" font-size="12" font-weight="800" fill="'+(ok?"var(--good)":"var(--bad)")+'">P'+(i+1)+' ('+f(p[0])+', '+f(p[1])+')</text>');});
  g.push('<line x1="'+L+'" y1="'+(T+ph)+'" x2="'+(L+pw)+'" y2="'+(T+ph)+'" stroke="var(--ink)" stroke-width="2"/><line x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+(T+ph)+'" stroke="var(--ink)" stroke-width="2"/>');
  g.push('<text x="'+(L+pw/2)+'" y="'+(H-6)+'" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">x</text>');
  g.push('<text x="16" y="'+(T+ph/2)+'" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">y</text>');
  g.push('</svg>'); return g.join("");
}

function ineqOne(i,M){
  var m=i===1?M.m1:M.m2,b=i===1?M.b1:M.b2,B=M.B,c=i===1?"o1":"o2",col=i===1?"var(--opt1)":"var(--opt2)";
  var head='<div class="card '+c+'"><h3 class="'+c+'t">'+esc(nm(i))+'</h3>';
  if(B===null) return head+'<p class="warn">Enter your monthly budget in Part A.</p></div>';
  if(B<b) return head+'<p class="warn">The starting cost ('+peso(b)+') is already more than the budget ('+peso(B)+'). Your family cannot afford this option at all.</p></div>';
  if(m<=0) return head+'<p>The cost per use is ₱0, so any number of '+esc(U(2))+' fits the budget.</p></div>';
  var q=quo(B-b,m), k=q.val, g=Math.floor(k+1e-9);
  var s=lin(m,b)+" ≤ "+f(B)+"\n"+lin(m,0)+" ≤ "+f(B)+" − "+f(b)+"\n"+lin(m,0)+" ≤ "+f(B-b)+"\nx ≤ "+f(B-b)+" ÷ "+f(m)+"\nx ≤ "+q.txt;
  s+="\n\nCheck: "+f(m)+"("+g+") + "+f(b)+" = "+f(m*g+b)+" ≤ "+f(B)+" ✓";
  if(g+1>0) s+="\n       "+f(m)+"("+(g+1)+") + "+f(b)+" = "+f(m*(g+1)+b)+" > "+f(B)+" ✗";
  return head+'<p>Total cost must not go over the budget: cost ≤ budget.</p><div class="math">'+esc(s)+'</div>'+
    '<p class="big">At most '+g+' '+esc(U(g))+'</p><p>Since '+V("x")+' counts '+esc(U(2))+', '+V("x")+' must be a whole number from 0 to '+g+'.</p>'+
    '<div class="figure">'+numberLine(k,col)+'</div><p class="count">Closed circle at '+f(k)+' because the symbol is ≤ (the budget amount itself is allowed). Shade toward 0.</p></div>';
}

}

/* ---------- plain-text export ---------- */
function allText(){
  var M=model(), t=[];
  function strip(h){var d=document.createElement("div");d.innerHTML=h.replace(/<br\s*\/?>/g,"\n").replace(/<\/(p|li|div|tr|h3)>/g,"\n");return d.textContent.replace(/\n{3,}/g,"\n\n").trim();}
  t.push("THE WISE CHOICE REPORT\n"+(S.expense||""));
  t.push("PART A\n"+strip(VIEWS["part-a"].live())+"\nSource: "+(S.source||""));
  if(M.ok){
    t.push("PART B\n"+strip(VIEWS["part-b"].live()));
    t.push(tableX().map(function(x){return "x="+f(x)+"  "+nm(1)+" y="+f(M.y1(x))+"   "+nm(2)+" y="+f(M.y2(x));}).join("\n"));
    var keep=S.method; t.push("PART D\n"+strip(VIEWS["part-d"].live2()));
    S.method="sub"; t.push("Substitution:\n"+strip(VIEWS["part-d"].live3())); S.method="elim"; t.push("Elimination:\n"+strip(VIEWS["part-d"].live3())); S.method=keep;
    t.push(strip(VIEWS["part-d"].live4())); t.push(strip(VIEWS["part-d"].live5()));
    t.push("PART E\n"+strip(VIEWS["part-e"].live())); t.push(strip(VIEWS["part-e"].live2())+"\n"+strip(VIEWS["part-e"].live3()));
  }
  t.push("PART F (draft)\n"+(S.letter||""));
  t.push("PART G (draft)\n"+(S.reflection||""));
  return t.join("\n\n");
}

function mathify(root){

  },function(){msg.textContent="This browser cannot check the PIN. Open the app from its https:// link.";});
