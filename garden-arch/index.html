<style>
/* Layout: phone-first app — sticky header with Part A–G chips over a graph-paper ground; one part per screen; Back/Next bar at the bottom. */
:root{
  --paper:#f4f7f2; --surface:#ffffff; --ink:#182a1f; --muted:#4f6457; --grid:#dde7dc; --grid-strong:#c2d3c3;
  --navy:#1e3b2c; --on-navy:#ffffff; --hl:#a85d0c; --hl-ink:#ffffff; --hl-soft:#fbeedb;
  --arch:#2e7d32; --arch-soft:#e3f1e3; --alt:#c9541a; --alt-soft:#fdebe1; --cart:#2257c7; --cart-soft:#e5edfd; --brace:#6b4a2b;
  --good:#1f7a43; --good-soft:#e2f4e8; --bad:#b3261e; --bad-soft:#fbe5e3; --btn-border:#1e3b2c;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e1610; --surface:#152219; --ink:#e4efe6; --muted:#a3b8a8; --grid:#1d2c21; --grid-strong:#2e4434;
  --navy:#173022; --on-navy:#ffffff; --hl:#f0a54a; --hl-ink:#2a1700; --hl-soft:#33240f;
  --arch:#7fd37f; --arch-soft:#173119; --alt:#ff9a5f; --alt-soft:#3a2317; --cart:#7fa4ff; --cart-soft:#1b2950; --brace:#d8a777;
  --good:#6fd394; --good-soft:#15301f; --bad:#ff8a80; --bad-soft:#3a1714; --btn-border:#3f5c48;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1610; --surface:#152219; --ink:#e4efe6; --muted:#a3b8a8; --grid:#1d2c21; --grid-strong:#2e4434;
  --navy:#173022; --on-navy:#ffffff; --hl:#f0a54a; --hl-ink:#2a1700; --hl-soft:#33240f;
  --arch:#7fd37f; --arch-soft:#173119; --alt:#ff9a5f; --alt-soft:#3a2317; --cart:#7fa4ff; --cart-soft:#1b2950; --brace:#d8a777;
  --good:#6fd394; --good-soft:#15301f; --bad:#ff8a80; --bad-soft:#3a1714; --btn-border:#3f5c48;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.app{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:var(--on-navy);box-shadow:0 2px 10px rgba(0,0,0,.18)}
header.app .wrap{padding-block:10px 8px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:1.3rem;margin:0}
.brand small{font-size:.78rem;opacity:.8;letter-spacing:.06em;text-transform:uppercase}
.steps{display:flex;gap:6px;overflow-x:auto;padding-block:8px 2px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps a{flex:0 0 auto;min-width:44px;height:40px;padding:0 12px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:20px;color:var(--on-navy);text-decoration:none;font-weight:700;border:1.5px solid rgba(255,255,255,.35);font-size:.95rem}
.steps a.on{background:var(--hl);border-color:var(--hl);color:var(--hl-ink)}
.steps a .dot{width:7px;height:7px;border-radius:50%;background:#7be09e}
main .wrap{padding-block:18px 110px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--hl);font-weight:700}
h2{font-family:var(--f-display);font-weight:800;font-size:1.75rem;line-height:1.15;margin:2px 0 0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:1.18rem;margin:0 0 4px;text-wrap:balance}
p{margin:0}
.lead{color:var(--muted)}
.pts{display:inline-block;font-size:.8rem;font-weight:700;padding:2px 9px;border-radius:10px;background:var(--hl-soft);color:var(--hl);margin-left:6px;vertical-align:middle}
.card{background:var(--surface);border:1px solid var(--grid-strong);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.note{background:var(--hl-soft);border-radius:var(--r);padding:12px 14px;font-size:.95rem}
.example{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--hl-soft);border:1.5px dashed var(--hl);border-radius:var(--r);padding:12px 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.92rem;min-width:0}
label .hint{font-weight:400;color:var(--muted);font-size:.85rem}
input[type=text],input[type=number],input[type=password],textarea,select{font:inherit;font-weight:400;color:var(--ink);background:var(--paper);border:1.5px solid var(--grid-strong);border-radius:10px;padding:10px 12px;width:100%;min-height:46px}
textarea{min-height:220px;resize:vertical;line-height:1.6}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.unit{position:relative}
.unit input{padding-right:46px}
.unit::after{content:attr(data-u);position:absolute;right:12px;bottom:11px;color:var(--muted);font-weight:700}
.peso{position:relative}
.peso::before{content:"₱";position:absolute;left:12px;bottom:11px;color:var(--muted);font-weight:700}
.peso input{padding-left:28px}
button,a.btn{font:inherit;font-weight:700;border-radius:10px;border:1.5px solid var(--btn-border);background:var(--surface);color:var(--ink);padding:10px 16px;min-height:46px;cursor:pointer}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
button.primary{background:var(--navy);color:var(--on-navy);border-color:var(--btn-border)}
button.small{min-height:38px;padding:6px 12px;font-size:.9rem}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button[aria-pressed=true]{background:var(--hl);border-color:var(--hl);color:var(--hl-ink)}
.math{font-family:var(--f-mono);font-size:.95rem;background:var(--paper);border-radius:10px;padding:12px 14px;overflow-x:auto;white-space:pre;line-height:1.75;border:1px solid var(--grid)}
.eq{font-family:var(--f-mono);font-weight:600;font-size:1.15rem;overflow-x:auto;color:var(--arch)}
.v{font-style:italic;font-family:Georgia,"Times New Roman",serif;font-weight:700}
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--grid-strong);padding:8px 10px;text-align:center}
th{background:var(--paper);font-size:.9rem}
td.l,th.l{text-align:left}
td.calc{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);text-align:left;white-space:nowrap}
table.rub td{text-align:left;vertical-align:top} table.rub td:last-child{text-align:center;white-space:nowrap}
.figure{overflow-x:auto}
.figure svg{display:block;width:100%;height:auto;min-width:300px}
svg text{font-family:var(--f-body)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.9rem}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:22px;height:4px;border-radius:2px}
.pill{display:inline-block;padding:3px 10px;border-radius:12px;font-weight:700;font-size:.86rem;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.big{font-family:var(--f-display);font-weight:800;font-size:1.5rem;line-height:1.2}
ul.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.check label{flex-direction:row;align-items:flex-start;gap:10px;font-weight:400;font-size:.98rem}
ul.check input{width:22px;height:22px;flex:0 0 auto;margin-top:2px;accent-color:var(--navy)}
.timeline{display:flex;flex-direction:column;gap:10px}
.tl{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:var(--r);border:1px solid var(--grid-strong);background:var(--surface)}
.tl .d{font-family:var(--f-display);font-weight:800;line-height:1.1;text-align:center}
.tl .d b{display:block;font-size:1.6rem}
.tl.next{border:2px solid var(--hl);background:var(--hl-soft)}
.bar{height:10px;border-radius:5px;background:var(--grid);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good);border-radius:5px}
.prog{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.prog a{font-weight:700;color:var(--ink)}
blockquote{margin:0;padding:14px 16px;border-left:5px solid var(--hl);background:var(--hl-soft);border-radius:0 var(--r) var(--r) 0;font-style:italic;font-size:1.05rem}
details.card>summary{cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:1.15rem;list-style-position:inside}
.teacher-tag{display:inline-block;background:var(--ink);color:var(--paper);border-radius:8px;padding:2px 8px;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
nav.pager{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--grid-strong);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.pager .wrap{display:flex;justify-content:space-between;gap:10px;padding-block:10px}
nav.pager button{flex:1}
.warn{color:var(--bad);font-weight:700}
.muted{color:var(--muted)}
.count{font-size:.88rem;color:var(--muted)}
.math[data-tex]{white-space:normal;font-family:var(--f-body);font-size:1.02rem;line-height:1.4}
.math mjx-container[display="true"]{margin:0!important;text-align:left!important}
td.calc[data-tex]{white-space:nowrap}
.eq[data-tex]{font-size:1.1rem}
mjx-container{color:inherit}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:20px;font-weight:700;z-index:20}
@media (prefers-reduced-motion: no-preference){.view{animation:rise .25s ease-out}@keyframes rise{from{transform:translateY(6px)}to{transform:none}}}
</style>

<header class="app">
  <div class="wrap">
    <div class="brand"><h1>Garden Arch Helper</h1><small>Math 9 · Q3 PT</small></div>
    <nav class="steps" id="steps" aria-label="Parts of the task"></nav>
  </div>
</header>
<main><div class="wrap" id="view"></div></main>
<nav class="pager"><div class="wrap"><button id="prev" type="button">‹ Back</button><button id="next" class="primary" type="button">Next ›</button></div></nav>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
var KEY="gardenArch.v1";
var EXAMPLE={
  example:true, w:2.4, k:2.5, step:0.3, a2:-2.5,
  cart:{w:1.2,h:1.8}, scale:20,
  brace:{type:"45", x:0.6},
  price:110, priceNote:"", segs:8,
  crew:{w0:4,d0:6,deadline:5,wage:""},
  recommend:"", reflection:"", checks:{},
  tc:{who:"",w:"",k:"",a2:"",scale:20,type:"45",x:"",price:""}
};
function clone(o){return JSON.parse(JSON.stringify(o));}
var S=load();
function load(){try{var t=localStorage.getItem(KEY);if(t)return Object.assign(clone(EXAMPLE),JSON.parse(t));}catch(e){}return clone(EXAMPLE);}
var saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(function(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}},250);}

/* ---------- number helpers ---------- */
function num(v){var n=parseFloat(v);return isFinite(n)?n:null;}
function rd(n,d){var p=Math.pow(10,d==null?4:d);return Math.round(n*p)/p;}
function f(n,d){if(n===null||!isFinite(n))return "?";var x=rd(n,d==null?4:d);if(Object.is(x,-0))x=0;return (x<0?"−":"")+Math.abs(x).toLocaleString("en-US",{maximumFractionDigits:d==null?4:d});}
function f2(n){return f(n,2);}
function peso(n){return "₱"+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function V(s){return '<span class="v">'+s+'</span>';}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;}
/* exact fractions for decimals with up to 3 places */
function Fr(n,d){if(d<0){n=-n;d=-d;}var g=gcd(n,d);return {n:n/g,d:d/g};}
function fd(x){return Fr(Math.round(x*1000),1000);}
function fm(a,b){return Fr(a.n*b.n,a.d*b.d);} function fdv(a,b){return Fr(a.n*b.d,a.d*b.n);}
function fv(a){return a.n/a.d;}
function ft(a){/* text: integer, short decimal, or fraction ≈ decimal */
  if(a.d===1)return (a.n<0?"−":"")+Math.abs(a.n);
  var v=fv(a),s=String(Math.abs(v));if(s.split(".")[1]&&s.split(".")[1].length<=4)return f(v);
  return (a.n<0?"−":"")+Math.abs(a.n)+"/"+a.d+" ≈ "+f(v);}
function fts(a){/* fraction only (for writing in equations) */return a.d===1?f(fv(a)):((a.n<0?"−":"")+Math.abs(a.n)+"/"+a.d);}
function niceDec(v){var s=String(Math.abs(rd(v,6)));return !s.split(".")[1]||s.split(".")[1].length<=4;}

/* ---------- the arch model ---------- */
function arch(w,k){
  if(w===null||k===null||w<=0||k<=0)return null;
  var W=fd(w),K=fd(k),half=Fr(W.n,W.d*2),sq=fm(half,half),A=Fr(-K.n*sq.d,K.d*sq.n);
  return {w:w,k:k,half:fv(half),Hf:half,SQ:sq,A:A,a:fv(A),K:K,y:function(x){return fv(A)*x*x+k;}};
}
function M(){return arch(num(S.w),num(S.k));}
function aText(m){return niceDec(m.a)?f(m.a):fts(m.A)+" ≈ "+f(m.a);}
function vertexForm(m){return "y = "+(niceDec(m.a)?f(m.a):"−("+Math.abs(m.A.n)+"/"+m.A.d+")")+"(x − 0)² + "+f(m.k);}
function stdForm(m,dec){var c=dec||!niceDec(m.a)?f(m.a):f(m.a);return "y = "+(niceDec(m.a)?f(m.a):"−("+Math.abs(m.A.n)+"/"+m.A.d+")")+"x² + 0x + "+f(m.k);}

/* SVG plot of arches in meters (equal scale on both axes) */
function plot(m,opt){
  opt=opt||{};
  var xMax=m.half;if(opt.a2){xMax=Math.max(xMax,Math.sqrt(m.k/Math.abs(opt.a2)));}
  if(opt.brace)xMax=Math.max(xMax,opt.brace.foot);
  xMax=Math.ceil((xMax+0.2)*5)/5; var yMax=Math.ceil((m.k+0.3)*5)/5;
  var W=380,padL=34,padR=12,padT=14,padB=34,u=(W-padL-padR)/(2*xMax),H=Math.round(yMax*u+padT+padB);
  function X(x){return padL+(x+xMax)*u;} function Y(y){return padT+(yMax-y)*u;}
  var g=['<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Graph of the arch">'];
  g.push('<rect x="'+X(-xMax)+'" y="'+Y(yMax)+'" width="'+(2*xMax*u)+'" height="'+(yMax*u)+'" fill="var(--surface)" stroke="var(--grid-strong)"/>');
  for(var gx=-xMax;gx<=xMax+1e-9;gx+=0.1){var major=Math.abs(Math.round(gx*10))%5===0;g.push('<line x1="'+X(gx)+'" y1="'+Y(yMax)+'" x2="'+X(gx)+'" y2="'+Y(0)+'" stroke="'+(major?'var(--grid-strong)':'var(--grid)')+'"/>');
    if(major)g.push('<text x="'+X(gx)+'" y="'+(Y(0)+15)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+f(rd(gx,1))+'</text>');}
  for(var gy=0;gy<=yMax+1e-9;gy+=0.1){var mj=Math.round(gy*10)%5===0;g.push('<line x1="'+X(-xMax)+'" y1="'+Y(gy)+'" x2="'+X(xMax)+'" y2="'+Y(gy)+'" stroke="'+(mj?'var(--grid-strong)':'var(--grid)')+'"/>');
    if(mj&&gy>0)g.push('<text x="'+(X(0)-4)+'" y="'+(Y(gy)+3.5)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+f(rd(gy,1))+'</text>');}
  g.push('<line x1="'+X(-xMax)+'" y1="'+Y(0)+'" x2="'+X(xMax)+'" y2="'+Y(0)+'" stroke="var(--ink)" stroke-width="2"/><line x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+X(0)+'" y2="'+Y(yMax)+'" stroke="var(--ink)" stroke-width="1.5"/>');
  g.push('<text x="'+(X(xMax)-3)+'" y="'+(Y(0)+28)+'" text-anchor="end" font-size="11" font-weight="700" fill="var(--ink)">x (m)</text><text x="'+(X(0)-5)+'" y="'+(Y(yMax)+12)+'" text-anchor="end" font-size="11" font-weight="700" fill="var(--ink)">y (m)</text>');
  function curve(a,col,dash){var x0=Math.sqrt(m.k/Math.abs(a)),pts=[];for(var i=0;i<=60;i++){var x=-x0+2*x0*i/60;pts.push(X(x).toFixed(1)+","+Y(a*x*x+m.k).toFixed(1));}
    return '<polyline points="'+pts.join(" ")+'" fill="none" stroke="'+col+'" stroke-width="'+(dash?2.5:4)+'" stroke-linejoin="round"'+(dash?' stroke-dasharray="7 5"':'')+'/>';}
  if(opt.cart){var cw=opt.cart.w/2,ch=opt.cart.h;g.push('<rect x="'+X(-cw)+'" y="'+Y(ch)+'" width="'+(2*cw*u)+'" height="'+(ch*u)+'" fill="var(--cart-soft)" stroke="var(--cart)" stroke-width="2"/>');
    g.push('<text x="'+X(0)+'" y="'+(Y(ch/2)+4)+'" text-anchor="middle" font-size="12" font-weight="700" fill="var(--cart)">cart '+f(opt.cart.w)+' × '+f(ch)+'</text>');}
  if(opt.a2)g.push(curve(opt.a2,"var(--alt)",true));
  g.push(curve(m.a,"var(--arch)",false));
  if(opt.brace){var B=opt.brace;[1,-1].forEach(function(s){g.push('<line x1="'+X(s*B.x)+'" y1="'+Y(B.h)+'" x2="'+X(s*B.foot)+'" y2="'+Y(0)+'" stroke="var(--brace)" stroke-width="4" stroke-linecap="round"/>');
      g.push('<line x1="'+X(s*B.x)+'" y1="'+Y(B.h)+'" x2="'+X(s*B.x)+'" y2="'+Y(0)+'" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3"/>');});
    g.push('<path d="M'+(X(B.x)+8)+' '+Y(0)+' v-8 h-8" fill="none" stroke="var(--muted)" stroke-width="1.5"/>');
    g.push('<text x="'+(X((B.x+B.foot)/2)+6)+'" y="'+(Y(B.h/2)-4)+'" font-size="12" font-weight="800" fill="var(--brace)">brace '+f(B.len,2)+' m</text>');
    g.push('<text x="'+(X(B.foot)-10)+'" y="'+(Y(0)-6)+'" text-anchor="end" font-size="11" font-weight="700" fill="var(--brace)">'+B.ground+'°</text>');}
  if(opt.marks)opt.marks.forEach(function(p){g.push('<circle cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="4.5" fill="var(--arch)" stroke="var(--surface)" stroke-width="1.5"/>');});
  g.push('<circle cx="'+X(0)+'" cy="'+Y(m.k)+'" r="6" fill="var(--hl)" stroke="var(--surface)" stroke-width="2"/><text x="'+(X(0)+9)+'" y="'+(Y(m.k)-6)+'" font-size="12" font-weight="800" fill="var(--hl)">vertex (0, '+f(m.k)+')</text>');
  [-1,1].forEach(function(s){g.push('<circle cx="'+X(s*m.half)+'" cy="'+Y(0)+'" r="5" fill="var(--arch)" stroke="var(--surface)" stroke-width="2"/>');});
  g.push('<text x="'+X(-m.half)+'" y="'+(Y(0)+28)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--arch)">('+f(-m.half)+', 0)</text><text x="'+X(m.half)+'" y="'+(Y(0)+28)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--arch)">('+f(m.half)+', 0)</text>');

/* braces */
var BTYPE={"45":{label:"45-45-90 (45° with the ground)",ground:45},"60":{label:"30-60-90 (60° with the ground)",ground:60},"30":{label:"30-60-90 (30° with the ground)",ground:30}};
function brace(m){
  var x=num(S.brace.x),t=BTYPE[S.brace.type]?S.brace.type:"45";if(!m||x===null||x<=0||x>=m.half)return null;
  var h=m.y(x),run,len,steps;
  if(t==="45"){run=h;len=h*Math.SQRT2;steps="45-45-90: legs are equal, hypotenuse = leg × √2\nvertical leg (height) = "+f(h)+" m\nhorizontal leg = "+f(h)+" m\nbrace = "+f(h)+"√2 ≈ "+f(h)+" × 1.4142 ≈ "+f(len)+" m";}
  else if(t==="60"){run=h/Math.sqrt(3);len=2*h/Math.sqrt(3);steps="30-60-90 with the 60° angle at the ground:\nthe height is the LONG leg (opposite 60°) = "+f(h)+" m\nshort leg = long leg ÷ √3 = "+f(h)+" ÷ √3 ≈ "+f(run)+" m\nbrace (hypotenuse) = 2 × short leg ≈ "+f(len)+" m";}
  else {run=h*Math.sqrt(3);len=2*h;steps="30-60-90 with the 30° angle at the ground:\nthe height is the SHORT leg (opposite 30°) = "+f(h)+" m\nlong leg = short leg × √3 ≈ "+f(run)+" m\nbrace (hypotenuse) = 2 × short leg = "+f(len)+" m";}
  var tanG=Math.tan(BTYPE[t].ground*Math.PI/180),slope=Math.abs(2*m.a*x);
  return {x:x,h:h,run:run,len:len,foot:x+run,ground:BTYPE[t].ground,steps:steps,type:t,cuts:tanG>slope+1e-9,slope:slope};
}
/* arch length by straight segments */
function archLen(m,n){n=Math.max(2,Math.min(40,Math.round(n||8)));var pts=[],sum=0,rows=[];
  for(var i=0;i<=n;i++){var x=-m.half+m.w*i/n;pts.push([x,m.y(x)]);}
  for(var j=1;j<=n;j++){var dx=pts[j][0]-pts[j-1][0],dy=pts[j][1]-pts[j-1][1],d=Math.sqrt(dx*dx+dy*dy);sum+=d;rows.push([pts[j-1],pts[j],dx,dy,d]);}
  return {sum:sum,rows:rows,n:n};}

      if(/^(m|cm|mm|km)$/.test(w)&&/\d\s$/.test(s.slice(Math.max(0,i-2),i))&&!/[A-Za-z(]/.test(nx)){r+="\\,\\text{"+w+"}";i+=w.length;continue;}
      if(w.length===1||/[0-9)²\]]/.test(prev)||TX_MW[w]){
        if(w.length===1&&s[i+1]==="/"){var dn=txOperand(s,i+2);if(dn){r+="\\frac{"+w+"}{"+dn+"}";i+=2+dn.length;continue;}}
        r+=w;i+=w.length;continue;}
      var j=i+w.length,run=w;
      while(true){var mm=s.slice(j).match(/^([ ,.:;?!“”"’']*)([A-Za-z][A-Za-z’'\-]*)/);
        if(mm&&(mm[2].length>1&&!TX_MW[mm[2]])&&!/^[A-Za-z]$/.test(mm[2])){run+=mm[1]+mm[2];j+=mm[0].length;}else break;}
      var tp=s.slice(j).match(/^[,.:;?!]+/);if(tp){run+=tp[0];j+=tp[0].length;}
      var pre=(i>0&&/\s/.test(s[i-1])&&r.trim()!=="")?" ":"",post=/\s/.test(s[j]||"")&&s.slice(j).trim()!==""?" ":"";
      r+="\\text{"+pre+txText(run)+post+"}";i=j;continue;}
    if(c==="√"){var o=s[i+1];
      if(o==="["||o==="("){var cl=txMatch(s,i+1,o,o==="["?"]":")");if(cl>0){r+="\\sqrt{"+toTex(s.slice(i+2,cl))+"}";i=cl+1;continue;}}
      var op=s.slice(i+1).match(/^\d+(\.\d+)?|^[A-Za-z]/);if(op){r+="\\sqrt{"+op[0]+"}";i+=1+op[0].length;continue;}
      r+="\\sqrt{\\ }";i++;continue;}
    if(TX_SUP[c]){r+="^{"+TX_SUP[c]+"}";i++;continue;}
    if(TX_SYM[c]!==undefined){r+=TX_SYM[c];i++;continue;}
    r+=c;i++;
  }
  return r;
}
function mathify(root){
  if(!(window.MathJax&&MathJax.typeset)||!root)return;
  var els=root.querySelectorAll(".math,.eq,td.calc,.mx"),any=false;
  Array.prototype.forEach.call(els,function(el){
    if(el.getAttribute("data-tex"))return;
    var plain=(el.innerText||el.textContent||"").replace(/ /g," ").replace(/\s+$/,"");if(!plain.trim())return;
    var lines=plain.split("\n"),tex;
    if(el.classList.contains("math")){tex="\\[\\begin{aligned}"+lines.map(function(l){if(!l.trim())return "&\\phantom{0}";var t=toTex(l).replace(/^\s*-/,"{-}");return "&"+t;}).join("\\\\")+"\\end{aligned}\\]";}
    else if(lines.length>1){tex="\\(\\begin{aligned}"+lines.map(function(l){return "&"+toTex(l);}).join("\\\\")+"\\end{aligned}\\)";}
    else tex="\\("+(el.classList.contains("eq")||el.classList.contains("mx")?"\\displaystyle ":"")+toTex(plain)+"\\)";
    el.setAttribute("data-plain",plain);el.textContent=tex;el.setAttribute("data-tex","1");any=true;});
  if(!any)return;
  try{MathJax.typesetClear([root]);MathJax.typeset([root]);}catch(e){}
}
