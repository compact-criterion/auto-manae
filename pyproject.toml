[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hymnslides"
version = "0.1.0"
description = "Turn hymn music into PowerPoint slides with engraved notation"
requires-python = ">=3.10"  # Windows: 3.11-3.13 have ready-made packages for everything
dependencies = [
    "verovio>=4.3",
    "resvg-py>=0.2",
    "Pillow>=10",
    "PyYAML>=6",
    "python-pptx>=1.0",
    "mido>=1.3",
    "numpy",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
hymnslides = "hymnslides.cli:main"

[tool.setuptools]
packages = ["hymnslides"]

[tool.setuptools.package-data]
hymnslides = ["fonts/*"]
