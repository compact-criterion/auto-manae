<style>
/* Layout: phone-first group app — sticky header with Part A–F chips over a graph-paper ground; one phase per screen; Back/Next bar at the bottom. */
:root{
  --paper:#f3f6f5; --surface:#ffffff; --ink:#132826; --muted:#4b625f; --grid:#dae5e3; --grid-strong:#bcd0cd;
  --navy:#173a3a; --on-navy:#ffffff; --hl:#b5521b; --hl-ink:#ffffff; --hl-soft:#fbe9de;
  --bio:#2e7d32; --rec:#1f5fbf; --res:#6d5a4b; --curve:#1f5fbf; --shade:rgba(181,82,27,.35); --bar:#3b8f88;
  --good:#1f7a43; --good-soft:#e2f4e8; --bad:#b3261e; --bad-soft:#fbe5e3; --btn-border:#173a3a;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0c1615; --surface:#132220; --ink:#e3efed; --muted:#9fb6b2; --grid:#1b2c2a; --grid-strong:#2c4441;
  --navy:#112e2e; --on-navy:#ffffff; --hl:#ff9a5f; --hl-ink:#2a1200; --hl-soft:#3a2317;
  --bio:#7fd37f; --rec:#7fa4ff; --res:#cdb7a3; --curve:#7fa4ff; --shade:rgba(255,154,95,.35); --bar:#5fc2b9;
  --good:#6fd394; --good-soft:#15301f; --bad:#ff8a80; --bad-soft:#3a1714; --btn-border:#3d5c58;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0c1615; --surface:#132220; --ink:#e3efed; --muted:#9fb6b2; --grid:#1b2c2a; --grid-strong:#2c4441;
  --navy:#112e2e; --on-navy:#ffffff; --hl:#ff9a5f; --hl-ink:#2a1200; --hl-soft:#3a2317;
  --bio:#7fd37f; --rec:#7fa4ff; --res:#cdb7a3; --curve:#7fa4ff; --shade:rgba(255,154,95,.35); --bar:#5fc2b9;
  --good:#6fd394; --good-soft:#15301f; --bad:#ff8a80; --bad-soft:#3a1714; --btn-border:#3d5c58;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.app{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:var(--on-navy);box-shadow:0 2px 10px rgba(0,0,0,.18)}
header.app .wrap{padding-block:10px 8px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:1.3rem;margin:0}
.brand small{font-size:.78rem;opacity:.8;letter-spacing:.06em;text-transform:uppercase}
.steps{display:flex;gap:6px;overflow-x:auto;padding-block:8px 2px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps a{flex:0 0 auto;min-width:44px;height:40px;padding:0 12px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:20px;color:var(--on-navy);text-decoration:none;font-weight:700;border:1.5px solid rgba(255,255,255,.35);font-size:.95rem}
.steps a.on{background:var(--hl);border-color:var(--hl);color:var(--hl-ink)}
.steps a .dot{width:7px;height:7px;border-radius:50%;background:#7be09e}
main .wrap{padding-block:18px 110px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--hl);font-weight:700}
h2{font-family:var(--f-display);font-weight:800;font-size:1.75rem;line-height:1.15;margin:2px 0 0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:1.18rem;margin:0 0 4px;text-wrap:balance}
p{margin:0}
.lead{color:var(--muted)}
.tag{display:inline-block;font-size:.76rem;font-weight:700;padding:2px 8px;border-radius:8px;margin-right:4px;vertical-align:middle}
.tag.m{background:#e5edfd;color:#1f4fa8} .tag.g{background:#fbe9de;color:#9a4214}
:root[data-theme="dark"] .tag.m{background:#1b2950;color:#a9c2ff} :root[data-theme="dark"] .tag.g{background:#3a2317;color:#ffb98f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.m{background:#1b2950;color:#a9c2ff} :root:not([data-theme="light"]) .tag.g{background:#3a2317;color:#ffb98f}}
.card{background:var(--surface);border:1px solid var(--grid-strong);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.note{background:var(--hl-soft);border-radius:var(--r);padding:12px 14px;font-size:.95rem}
.example{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--hl-soft);border:1.5px dashed var(--hl);border-radius:var(--r);padding:12px 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.92rem;min-width:0}
label .hint{font-weight:400;color:var(--muted);font-size:.85rem}
input[type=text],input[type=number],input[type=password],textarea,select{font:inherit;font-weight:400;color:var(--ink);background:var(--paper);border:1.5px solid var(--grid-strong);border-radius:10px;padding:10px 12px;width:100%;min-height:46px}
textarea{min-height:200px;resize:vertical;line-height:1.6}
textarea.short{min-height:90px}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.unit{position:relative}
.unit input{padding-right:52px}
.unit::after{content:attr(data-u);position:absolute;right:12px;bottom:11px;color:var(--muted);font-weight:700}
.peso{position:relative}
.peso::before{content:"₱";position:absolute;left:12px;bottom:11px;color:var(--muted);font-weight:700}
.peso input{padding-left:28px}
button,a.btn{font:inherit;font-weight:700;border-radius:10px;border:1.5px solid var(--btn-border);background:var(--surface);color:var(--ink);padding:10px 16px;min-height:46px;cursor:pointer}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
button.primary{background:var(--navy);color:var(--on-navy);border-color:var(--btn-border)}
button.small{min-height:38px;padding:6px 12px;font-size:.9rem}
button.x{min-height:36px;min-width:36px;padding:4px 8px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button[aria-pressed=true]{background:var(--hl);border-color:var(--hl);color:var(--hl-ink)}
.math{font-family:var(--f-mono);font-size:.95rem;background:var(--paper);border-radius:10px;padding:12px 14px;overflow-x:auto;white-space:pre;line-height:1.75;border:1px solid var(--grid)}
.eq{font-family:var(--f-mono);font-weight:600;font-size:1.1rem;overflow-x:auto}
code{font-family:var(--f-mono);font-size:.88rem;background:var(--paper);border:1px solid var(--grid);border-radius:6px;padding:1px 6px;white-space:nowrap}
.v{font-style:italic;font-family:Georgia,"Times New Roman",serif;font-weight:700}
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--grid-strong);padding:7px 9px;text-align:center}
th{background:var(--paper);font-size:.88rem}
td.l,th.l{text-align:left}
td.calc{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);text-align:left;white-space:nowrap}
table.rub td{text-align:left;vertical-align:top} table.rub td:last-child{text-align:center;white-space:nowrap}
table.dense td,table.dense th{padding:4px 6px;font-size:.85rem}
.dense input{min-height:36px;padding:4px 6px;width:58px}
.figure{overflow-x:auto}
.figure svg{display:block;width:100%;height:auto;min-width:300px}
svg text{font-family:var(--f-body)}
.pill{display:inline-block;padding:3px 10px;border-radius:12px;font-weight:700;font-size:.86rem;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.hl{background:var(--hl-soft);color:var(--hl)}
.big{font-family:var(--f-display);font-weight:800;font-size:1.45rem;line-height:1.2}
ul.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.check label{flex-direction:row;align-items:flex-start;gap:10px;font-weight:400;font-size:.98rem}
ul.check input{width:22px;height:22px;flex:0 0 auto;margin-top:2px;accent-color:var(--navy)}
.timeline{display:flex;flex-direction:column;gap:10px}
.tl{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:var(--r);border:1px solid var(--grid-strong);background:var(--surface)}
.tl .d{font-family:var(--f-display);font-weight:800;line-height:1.1;text-align:center}
.tl .d b{display:block;font-size:1.5rem}
.tl.next{border:2px solid var(--hl);background:var(--hl-soft)}
.bar{height:10px;border-radius:5px;background:var(--grid);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good);border-radius:5px}
.prog{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.prog a{font-weight:700;color:var(--ink)}
blockquote{margin:0;padding:14px 16px;border-left:5px solid var(--hl);background:var(--hl-soft);border-radius:0 var(--r) var(--r) 0;font-style:italic;font-size:1.05rem}
details.card>summary,details.sub>summary{cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:1.1rem;list-style-position:inside}
.teacher-tag{display:inline-block;background:var(--ink);color:var(--paper);border-radius:8px;padding:2px 8px;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.member{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:8px}
.src{border:1px solid var(--grid-strong);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.timer{font-family:var(--f-mono);font-size:3rem;font-weight:600;text-align:center;line-height:1}
.segbar{display:flex;gap:4px}
.segbar span{flex:1;height:10px;border-radius:5px;background:var(--grid)}
.segbar span.done{background:var(--good)} .segbar span.now{background:var(--hl)}
nav.pager{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--grid-strong);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.pager .wrap{display:flex;justify-content:space-between;gap:10px;padding-block:10px}
nav.pager button{flex:1}
.warn{color:var(--bad);font-weight:700}
.muted{color:var(--muted)}
.count{font-size:.88rem;color:var(--muted)}
.math[data-tex]{white-space:normal;font-family:var(--f-body);font-size:1.02rem;line-height:1.4}
.math mjx-container[display="true"]{margin:0!important;text-align:left!important}
td.calc[data-tex]{white-space:nowrap}
.eq[data-tex]{font-size:1.1rem}
mjx-container{color:inherit}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:20px;font-weight:700;z-index:20}
@media (prefers-reduced-motion: no-preference){.view{animation:rise .25s ease-out}@keyframes rise{from{transform:translateY(6px)}to{transform:none}}}
</style>

<header class="app">

<script>
(function(){
"use strict";
var KEY="wasteWatch.v1";
var ANG={
  seg:{label:"Segregation and collection",x:"number of waste types the household separates (0–3: biodegradable, recyclable, residual)",xs:"types separated",design:"Three-bin segregation set for a household or classroom",bins:3,ramp:false,served:1,share:100,days:7,
       meaning:function(e){return "A typical BBSI household separates about "+f(e,2)+" of the 3 waste types.";}},
  plastic:{label:"Single-use plastics",x:"number of sachets and plastic bags the household throws away in one day",xs:"sachets and bags per day",design:"Plastic drop-off box for the school gate",bins:1,ramp:false,served:400,share:10,days:7,
       meaning:function(e){return "A typical BBSI household throws away about "+f(e,1)+" sachets and plastic bags a day, or about "+f(e*7,0)+" a week.";}},
  recycle:{label:"Recycling chain: MRFs, EPR, and waste pickers",x:"number of times in a week the household sells or gives recyclables to collectors",xs:"times per week",design:"Covered sorting station for a purok materials recovery facility, with an access ramp",bins:1,ramp:true,served:150,share:30,days:7,
       meaning:function(e){return "A typical BBSI household hands recyclables to collectors about "+f(e,2)+" times a week.";}}
};
var ROLES=["Leader","Data manager","Designer","Researcher","Campaign head"];

/* deterministic example data (marked as example in the app) */
function rng(seed){var s=seed;return function(){s=(s*1103515245+12345)%2147483648;return s/2147483648;};}
function gauss(r){var u=Math.max(1e-9,r()),v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function exampleX(angle,r){var u=r();if(angle==="seg")return u<.15?0:u<.45?1:u<.8?2:3;
  if(angle==="plastic"){var L=Math.exp(-6),k=0,p=1;do{k++;p*=r();}while(p>L);return Math.min(14,k-1);}
  return u<.35?0:u<.65?1:u<.85?2:u<.95?3:4;}
function exampleData(angle){var r=rng(2027),out=[];for(var i=0;i<60;i++){var base=1.3+0.3*gauss(r),d=[];
  for(var j=0;j<7;j++)d.push(Math.max(0.2,Math.round((base+0.25*gauss(r))*10)/10));
  var ok=true;if(i===17||i===41){d[5]="";ok=false;}out.push({d:d,x:exampleX(angle,r),ok:ok});}return out;}

var EXAMPLE={
  example:true, angle:"seg", group:{name:"",members:ROLES.map(function(r){return {name:"",role:r};})},
  steps:{}, sources:[{title:"",outlet:"",says:"",trust:""}], gov:"", items:"",
  samp:{N:400,conf:"95",p:0.5,e:0.1,strata:[{name:"Kinder to Grade 6",Nh:180},{name:"Grades 7 to 10",Nh:140},{name:"Grades 11 and 12",Nh:80}]},
  picks:{}, forms:{sent:80,returned:60},
  data:null, exData:true, bin:"",
  nq:[{type:">",a:10,b:""},{type:"<",a:7,b:""}], top:10, served:400, assume:"", concl:"",
  des:{sackMass:4.5,sackVol:50,served:1,days:7,share:100,overflow:20,bins:3,L:0.40,W:0.30,H:0.50,openTop:true,scale:10,price:400,d:8,theta:32,eye:1.5,rise:0.3,run:4},
  cer:[{claim:"",evidence:"",reasoning:""},{claim:"",evidence:"",reasoning:""},{claim:"",evidence:"",reasoning:""}],
  cta:{barangay:"",school:"",households:""}, refl:"",
  tc:{N:"",conf:"95",p:0.5,e:0.1,strata:"",paste:"",type:">",a:"",top:10,served:"",sackMass:"",sackVol:"",d:"",theta:"",eye:1.5,rise:"",run:""}
};
EXAMPLE.data=exampleData("seg");
function clone(o){return JSON.parse(JSON.stringify(o));}
var S=load();
function load(){try{var t=localStorage.getItem(KEY);if(t)return Object.assign(clone(EXAMPLE),JSON.parse(t));}catch(e){}return clone(EXAMPLE);}
var saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(function(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}},250);}

/* ---------- number helpers ---------- */
function num(v){if(v===""||v==null)return null;var n=parseFloat(v);return isFinite(n)?n:null;}
function rd(n,d){var p=Math.pow(10,d==null?4:d);return Math.round(n*p)/p;}
function f(n,d){if(n===null||n===undefined||!isFinite(n))return "?";var x=rd(n,d==null?4:d);if(Object.is(x,-0))x=0;return (x<0?"−":"")+Math.abs(x).toLocaleString("en-US",{maximumFractionDigits:d==null?4:d});}
function peso(n){return "₱"+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function V(s){return '<span class="v">'+s+'</span>';}
function ang(){return ANG[S.angle]||ANG.seg;}
/* normal distribution */
function erf(x){var s=x<0?-1:1;x=Math.abs(x);var t=1/(1+0.3275911*x);var y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);return s*y;}
function Phi(z){return 0.5*(1+erf(z/Math.SQRT2));}
function invPhi(p){var a=[-39.69683028665376,220.9460984245205,-275.9285104469687,138.357751867269,-30.66479806614716,2.506628277459239],b=[-54.47609879822406,161.5858368580409,-155.6989798598866,66.80131188771972,-13.28068155288572],c=[-0.007784894002430293,-0.3223964580411365,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783],d=[0.007784695709041462,0.3224671290700398,2.445134137142996,3.754408661907416];
  var q,r;if(p<0.02425){q=Math.sqrt(-2*Math.log(p));return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
  if(p>1-0.02425){q=Math.sqrt(-2*Math.log(1-p));return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
  q=p-0.5;r=q*q;return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);}
var ZCONF={"90":1.645,"95":1.96,"99":2.576};

/* ---------- data ---------- */
function records(){return (S.data||[]).map(function(r){var ds=r.d.map(num),comp=r.ok!==false&&ds.every(function(v){return v!==null&&v>=0;});
  return {d:ds,W:comp?ds.reduce(function(a,b){return a+b;},0):null,x:num(r.x),ok:comp};});}
function wStats(){var W=records().filter(function(r){return r.ok;}).map(function(r){return r.W;});var n=W.length;if(n<2)return {n:n};
  var sum=W.reduce(function(a,b){return a+b;},0),mean=sum/n,ss=W.reduce(function(a,b){return a+(b-mean)*(b-mean);},0),sd=Math.sqrt(ss/(n-1));
  var s=W.slice().sort(function(a,b){return a-b;}),med=n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2;
  var w1=W.filter(function(w){return Math.abs(w-mean)<=sd;}).length/n,w2=W.filter(function(w){return Math.abs(w-mean)<=2*sd;}).length/n;
  return {n:n,W:W,sum:sum,mean:mean,ss:ss,sd:sd,med:med,min:s[0],max:s[n-1],w1:w1,w2:w2};}
function xDist(){var xs=records().filter(function(r){return r.x!==null;}).map(function(r){return r.x;});var n=xs.length,fq={};
  xs.forEach(function(x){fq[x]=(fq[x]||0)+1;});var keys=Object.keys(fq).map(Number).sort(function(a,b){return a-b;});
  var E=keys.reduce(function(s,x){return s+x*fq[x]/n;},0);return {n:n,keys:keys,fq:fq,E:E};}

/* PART C */
function normalSVG(st,lo,hi){
  var W=380,H=180,L=14,R=14,T=12,B=34,pw=W-L-R,ph=H-T-B,x0=st.mean-3.5*st.sd,x1=st.mean+3.5*st.sd;
  function X(x){return L+(x-x0)/(x1-x0)*pw;} function pdf(x){return Math.exp(-0.5*Math.pow((x-st.mean)/st.sd,2));} function Y(y){return T+ph-y*ph;}
  var pts=[],shade=[],a=lo==null?x0:Math.max(x0,lo),b=hi==null?x1:Math.min(x1,hi);
  for(var i=0;i<=120;i++){var x=x0+(x1-x0)*i/120;pts.push(X(x).toFixed(1)+","+Y(pdf(x)).toFixed(1));}
  shade.push(X(a).toFixed(1)+","+Y(0));for(var j=0;j<=60;j++){var xx=a+(b-a)*j/60;shade.push(X(xx).toFixed(1)+","+Y(pdf(xx)).toFixed(1));}shade.push(X(b).toFixed(1)+","+Y(0));
  var g=['<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Normal curve with the shaded probability">'];
  g.push('<polygon points="'+shade.join(" ")+'" fill="var(--shade)"/><polyline points="'+pts.join(" ")+'" fill="none" stroke="var(--curve)" stroke-width="3"/>');
  g.push('<line x1="'+L+'" y1="'+Y(0)+'" x2="'+(W-R)+'" y2="'+Y(0)+'" stroke="var(--ink)" stroke-width="1.5"/>');
  for(var k=-3;k<=3;k++){var xv=st.mean+k*st.sd;g.push('<line x1="'+X(xv)+'" y1="'+Y(0)+'" x2="'+X(xv)+'" y2="'+(Y(0)+5)+'" stroke="var(--ink)"/><text x="'+X(xv)+'" y="'+(Y(0)+18)+'" text-anchor="middle" font-size="10.5" fill="var(--muted)">'+f(xv,1)+'</text>');}
  g.push('<text x="'+(W-R)+'" y="'+(H-2)+'" text-anchor="end" font-size="11" font-weight="700" fill="var(--ink)">W (kg per week)</text>');
  [lo,hi].forEach(function(v){if(v!=null&&v>x0&&v<x1)g.push('<line x1="'+X(v)+'" y1="'+T+'" x2="'+X(v)+'" y2="'+Y(0)+'" stroke="var(--hl)" stroke-width="2" stroke-dasharray="5 4"/><text x="'+X(v)+'" y="'+(T+10)+'" text-anchor="middle" font-size="11" font-weight="800" fill="var(--hl)">'+f(v,2)+'</text>');});
  g.push('</svg>');return g.join("");
}
function histSVG(st,width){
  var lo=Math.floor(st.min/width)*width,k=Math.max(1,Math.ceil((st.max-lo+1e-9)/width)),cnt=[];for(var i=0;i<k;i++)cnt.push(0);
  st.W.forEach(function(w){var b=Math.min(k-1,Math.floor((w-lo)/width+1e-9));cnt[b]++;});
  var W=380,H=220,L=34,R=10,T=12,B=40,pw=W-L-R,ph=H-T-B,mx=Math.max.apply(null,cnt),bw=pw/k;
  var g=['<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Histogram of W">'];
  var yt=Math.max(1,Math.ceil(mx/5));for(var y=0;y<=mx;y+=yt){var yy=T+ph-y/mx*ph;g.push('<line x1="'+L+'" y1="'+yy+'" x2="'+(W-R)+'" y2="'+yy+'" stroke="var(--grid)"/><text x="'+(L-5)+'" y="'+(yy+4)+'" text-anchor="end" font-size="10.5" fill="var(--muted)">'+y+'</text>');}
  cnt.forEach(function(c,i){var h=c/mx*ph;g.push('<rect x="'+(L+i*bw+1)+'" y="'+(T+ph-h)+'" width="'+(bw-2)+'" height="'+h+'" fill="var(--bar)"/>');
    if(k<=12||i%2===0)g.push('<text x="'+(L+i*bw)+'" y="'+(T+ph+15)+'" text-anchor="middle" font-size="10.5" fill="var(--muted)">'+f(lo+i*width,1)+'</text>');});
  /* normal curve scaled to counts */
  var pts=[];for(var j=0;j<=80;j++){var x=lo+k*width*j/80,dens=st.n*width/(st.sd*Math.sqrt(2*Math.PI))*Math.exp(-0.5*Math.pow((x-st.mean)/st.sd,2));pts.push((L+(x-lo)/width*bw).toFixed(1)+","+(T+ph-Math.min(dens,mx*1.15)/mx*ph).toFixed(1));}
  g.push('<polyline points="'+pts.join(" ")+'" fill="none" stroke="var(--hl)" stroke-width="2.5"/>');
  g.push('<line x1="'+L+'" y1="'+(T+ph)+'" x2="'+(W-R)+'" y2="'+(T+ph)+'" stroke="var(--ink)" stroke-width="1.5"/><text x="'+(W-R)+'" y="'+(H-4)+'" text-anchor="end" font-size="11" font-weight="700" fill="var(--ink)">W (kg per week)</text><text x="4" y="'+(T+8)+'" font-size="11" font-weight="700" fill="var(--ink)">households</text>');
  g.push('</svg>');return {svg:g.join(""),k:k,lo:lo,cnt:cnt};
}
function nQuestion(q,st,idx){
  var a=num(q.a),b=num(q.b);if(a===null||(q.type==="between"&&b===null))return '<p class="muted">Enter the value'+(q.type==="between"?'s':'')+' for question '+idx+'.</p>';
  if(q.type==="between"&&b<a){var t=a;a=b;b=t;}
  var za=(a-st.mean)/st.sd,zb=b===null?null:(b-st.mean)/st.sd,P,txt,lo=null,hi=null,form;
  var s="z = (x − μ) / σ ≈ (" +f(a,2)+" − "+f(st.mean,2)+") / "+f(st.sd,2)+" ≈ "+f(za,2);
  if(q.type===">"){P=1-Phi(za);lo=a;s+="\nP(W > "+f(a,2)+") = P(Z > "+f(za,2)+") = 1 − "+f(Phi(za))+" ≈ "+f(P);form='=1-NORM.DIST('+f(a,2)+', '+f(st.mean,2)+', '+f(st.sd,2)+', TRUE)';txt="About "+f(P*100,1)+"% of BBSI households produce more than "+f(a,2)+" kg of garbage in a week.";}
  else if(q.type==="<"){P=Phi(za);hi=a;s+="\nP(W < "+f(a,2)+") = P(Z < "+f(za,2)+") ≈ "+f(P);form='=NORM.DIST('+f(a,2)+', '+f(st.mean,2)+', '+f(st.sd,2)+', TRUE)';txt="About "+f(P*100,1)+"% of BBSI households produce less than "+f(a,2)+" kg of garbage in a week.";}
  else{P=Phi(zb)-Phi(za);lo=a;hi=b;s+="\nz = ("+f(b,2)+" − "+f(st.mean,2)+") / "+f(st.sd,2)+" ≈ "+f(zb,2)+"\nP("+f(a,2)+" < W < "+f(b,2)+") = "+f(Phi(zb))+" − "+f(Phi(za))+" ≈ "+f(P);form='=NORM.DIST('+f(b,2)+', …, TRUE) − NORM.DIST('+f(a,2)+', …, TRUE)';txt="About "+f(P*100,1)+"% of BBSI households produce between "+f(a,2)+" and "+f(b,2)+" kg of garbage in a week.";}
  return '<div class="math">'+esc(s)+'</div><p>Spreadsheet check: <code>'+esc(form)+'</code></p><p class="big">≈ '+f(P*100,1)+'%</p><p><b>In plain words:</b> '+esc(txt)+'</p><div class="figure">'+normalSVG(st,lo,hi)+'</div><p class="count">A z-table may differ in the last digit because it rounds z to two decimals.</p>';
}

    if(el.classList.contains("math")){tex="\\[\\begin{aligned}"+lines.map(function(l){if(!l.trim())return "&\\phantom{0}";return "&"+toTex(l).replace(/^\s*-/,"{-}");}).join("\\\\")+"\\end{aligned}\\]";}
    else if(lines.length>1){tex="\\(\\begin{aligned}"+lines.map(function(l){return "&"+toTex(l);}).join("\\\\")+"\\end{aligned}\\)";}
    else tex="\\("+(el.classList.contains("eq")||el.classList.contains("mx")?"\\displaystyle ":"")+toTex(plain)+"\\)";
    el.setAttribute("data-plain",plain);el.textContent=tex;el.setAttribute("data-tex","1");any=true;});
  if(!any)return;
  try{MathJax.typesetClear([root]);MathJax.typeset([root]);}catch(e){}
}
window.__mathify=function(){mathify(document.getElementById("view"));};

/* ---------- rendering ---------- */
var viewEl=document.getElementById("view"),stepsEl=document.getElementById("steps");
function renderSteps(){
  stepsEl.innerHTML=ORDER.map(function(k){var done=k!=="plan"&&partProgress(k)===1;return '<a href="#'+k+'"'+(k===cur?' class="on" aria-current="page"':'')+'>'+LABEL[k]+(done?'<span class="dot" aria-label="done"></span>':'')+'</a>';}).join("");
  var on=stepsEl.querySelector(".on");if(on&&on.scrollIntoView)on.scrollIntoView({block:"nearest",inline:"center"});
}
function renderLive(){var v=viewFor(cur);["live","live2","live3","live4","live5"].forEach(function(id){if(!v[id])return;var h=v[id]();var el=document.getElementById(id);if(el&&h!==null)el.innerHTML=h;});
  if(v.nq)v.nq();mathify(viewEl);}
function show(k){
  if(!VIEWS[k])k="plan";cur=k;var v=viewFor(k);
  viewEl.innerHTML='<div class="view" style="display:flex;flex-direction:column;gap:16px">'+v.stat()+'</div>';
  if(v.srcList)v.srcList();if(v.strata)v.strata();if(k==="part-e")drawTimer();
  renderLive();renderSteps();
  var i=ORDER.indexOf(k);document.getElementById("prev").disabled=i===0;
  document.getElementById("next").textContent=(i===ORDER.length-1||i<0)?"Back to Plan":"Next ›";
  window.scrollTo(0,0);
}
function route(){show((location.hash||"#plan").slice(1));}
window.addEventListener("hashchange",route);
document.getElementById("prev").addEventListener("click",function(){var i=ORDER.indexOf(cur);if(i<0)location.hash="plan";else if(i>0)location.hash=ORDER[i-1];});
document.getElementById("next").addEventListener("click",function(){var i=ORDER.indexOf(cur);location.hash=ORDER[(i+1)%ORDER.length];});
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){t.hidden=true;},2200);}
function copyText(txt,box){var fb=function(){if(box){box.hidden=false;box.value=txt;box.focus();box.select();}toast("Select all and copy");};try{navigator.clipboard.writeText(txt).then(function(){toast("Copied");},fb);}catch(err){fb();}}
function realData(){if(S.exData){S.data=[];S.exData=false;}}

viewEl.addEventListener("input",function(e){
  var el=e.target,k=el.getAttribute("data-k");if(!k||el.tagName==="SELECT")return;
  var v=el.value;if(el.type==="number"){var n=num(v);v=n===null?"":n;}
  set(k,v);if(/^(samp|des|forms|served|nq|top)/.test(k))S.example=false;save();renderLive();
});
viewEl.addEventListener("change",function(e){
  var el=e.target;
  if(el.getAttribute("data-step")){S.steps[el.getAttribute("data-step")]=el.checked;save();renderSteps();renderLive();return;}
  if(el.tagName==="SELECT"){var k=el.getAttribute("data-k"),v=el.value;if(k==="des.openTop")v=(v==="true");set(k,v);save();renderLive();}
});
viewEl.addEventListener("submit",function(e){
  if(e.target.id!=="pinForm")return;e.preventDefault();
  var inp=document.getElementById("pin"),msg=document.getElementById("pinMsg");
  var wait=Math.ceil((tcWaitUntil-Date.now())/1000);
  if(wait>0){msg.textContent="Too many tries. Wait "+wait+" seconds, then try again.";return;}
  var tries;try{tries=sha256hex("bbsi-teacher-check|"+inp.value.trim());}catch(err){tries=Promise.reject(err);}
  tries.then(function(h){
    if(h===TC_HASH){tcOpen=true;tcFails=0;try{sessionStorage.setItem("tcOpen",TC_HASH);}catch(e2){}show("teacher");toast("Teacher Check unlocked");}
    else{tcFails++;inp.value="";inp.focus();
      if(tcFails>=5){tcFails=0;tcWaitUntil=Date.now()+30000;msg.textContent="That PIN is not correct. Too many tries: wait 30 seconds.";}
      else msg.textContent="That PIN is not correct.";}
  },function(){msg.textContent="This browser cannot check the PIN. Open the app from its https:// link.";});
});
viewEl.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.hasAttribute("data-angle")){S.angle=b.getAttribute("data-angle");var A=ang();
    if(S.exData)S.data=exampleData(S.angle);if(S.example){S.des.bins=A.bins;S.des.served=A.served;S.des.share=A.share;S.served=400;}
    save();b.parentNode.querySelectorAll("button").forEach(function(x){x.setAttribute("aria-pressed",String(x===b));});renderLive();return;}
  if(b.hasAttribute("data-rmsrc")){S.sources.splice(Number(b.getAttribute("data-rmsrc")),1);if(!S.sources.length)S.sources.push({title:"",outlet:"",says:"",trust:""});save();VIEWS["part-a"].srcList();renderLive();return;}
  if(b.hasAttribute("data-rmst")){S.samp.strata.splice(Number(b.getAttribute("data-rmst")),1);S.picks={};save();VIEWS["part-b"].strata();renderLive();return;}
  if(b.hasAttribute("data-rmrow")){S.data.splice(Number(b.getAttribute("data-rmrow")),1);save();renderLive();toast("Row deleted");return;}
  var a=b.getAttribute("data-act");
  if(a==="addSrc"){S.sources.push({title:"",outlet:"",says:"",trust:""});save();VIEWS["part-a"].srcList();renderLive();}
  if(a==="addStratum"){S.samp.strata.push({name:"",Nh:""});save();VIEWS["part-b"].strata();renderLive();}
  if(a==="pick"){var s=sampleSize();if(!s){toast("Compute the sample size first");return;}S.picks={};
    S.samp.strata.forEach(function(st,i){var Nh=Math.floor(num(st.Nh)||0),nh=Math.min(Nh,Math.ceil(s.nUp*Nh/s.N-1e-9)),pool={},out=[],buf=new Uint32Array(1);
      while(out.length<nh){crypto.getRandomValues(buf);var v=1+buf[0]%Nh;if(!pool[v]){pool[v]=1;out.push(v);}}S.picks[i]=out.sort(function(x,y){return x-y;});});
    save();renderLive();toast("Random numbers drawn");}
  if(a==="addRow"){var d=[0,1,2,3,4,5,6].map(function(k){var v=document.getElementById("nd"+k).value;return v===""?"":Number(v);}),xv=document.getElementById("nx").value;
    if(d.every(function(v){return v==="";})){toast("Enter the day weights first");return;}
    realData();S.data.push({d:d,x:xv===""?"":Number(xv),ok:d.every(function(v){return v!=="";})});save();
    [0,1,2,3,4,5,6].forEach(function(k){document.getElementById("nd"+k).value="";});document.getElementById("nx").value="";document.getElementById("nd0").focus();renderLive();toast("Form "+S.data.length+" added");}
  if(a==="pasteAdd"||a==="pasteReplace"){var rows=parseRows(document.getElementById("pasteBox").value);if(!rows.length){toast("Nothing to add");return;}
    if(a==="pasteReplace")S.data=[];realData();S.data=S.data.concat(rows);document.getElementById("pasteBox").value="";save();renderLive();toast(rows.length+" rows added");}
  if(a==="copyCSV")copyText(toCSV(),null);
  if(a==="clearData"){document.getElementById("confirmData").hidden=false;}
  if(a==="clearDataNo"){document.getElementById("confirmData").hidden=true;}
  if(a==="clearDataYes"){S.data=[];S.exData=false;save();renderLive();toast("All rows deleted");}
  if(a==="tStart"){TM.run=!TM.run;clearInterval(TM.iv);if(TM.run)TM.iv=setInterval(tick,1000);drawTimer();}
  if(a==="tNext"){TM.seg=Math.min(FORUM.length-1,TM.seg+1);TM.left=FORUM[TM.seg][1]*60;drawTimer();}
  if(a==="tReset"){TM.run=false;clearInterval(TM.iv);TM.seg=0;TM.left=FORUM[0][1]*60;drawTimer();}
  if(a==="clear"){document.getElementById("confirmClear").hidden=false;}
  if(a==="clearNo"){document.getElementById("confirmClear").hidden=true;}
  if(a==="clearYes"){var bl=clone(EXAMPLE);bl.example=false;bl.exData=false;bl.data=[];bl.angle=S.angle;bl.group=S.group;bl.tc=S.tc;
    bl.samp={N:"",conf:"95",p:0.5,e:0.1,strata:[{name:"",Nh:""}]};bl.forms={sent:"",returned:""};bl.nq=[{type:">",a:"",b:""},{type:"<",a:"",b:""}];bl.served="";
    bl.des={sackMass:"",sackVol:"",served:ang().served,days:7,share:ang().share,overflow:20,bins:ang().bins,L:"",W:"",H:"",openTop:true,scale:10,price:"",d:"",theta:"",eye:1.5,rise:"",run:""};
    S=bl;save();location.hash="part-a";show("part-a");toast("Form cleared");}
  if(a==="tcLock"){tcOpen=false;try{sessionStorage.removeItem("tcOpen");}catch(e3){}location.hash="plan";toast("Teacher Check locked");}
  if(a==="tcClear"){S.tc=clone(EXAMPLE.tc);save();show("teacher");toast("Cleared");}
  if(a==="copyAll")copyText(allText(),document.getElementById("copyBox"));
});

route();
if("serviceWorker" in navigator&&location.protocol==="https:"&&!/claude\.ai|claudeusercontent/.test(location.hostname)){try{navigator.serviceWorker.register("sw.js").catch(function(){});}catch(e){}}
})();
